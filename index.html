<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piper TTS Tiếng Việt</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:20px 15px 40px} .card{background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(20,30,60,.07)}
h1{margin:0 0 5px;font-size:24px} .sub{margin:0 0 18px;color:#687386}
.drop{border:2px dashed #cbd4e3;border-radius:15px;padding:18px;text-align:center;background:#fafbfe}
input[type=file]{width:100%} textarea{width:100%;height:180px;resize:vertical;border:1px solid #d6dce7;border-radius:13px;padding:14px;font-size:17px;line-height:1.5;outline:none}
select{width:100%;padding:11px;border:1px solid #d6dce7;border-radius:11px;background:#fff} label{display:block;font-weight:600;margin:15px 0 7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px} button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#315efb;color:#fff} .secondary{background:#eef1f6} .buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.status{margin-top:14px;padding:11px 13px;border-radius:11px;background:#f1f4f9;color:#5e6878;font-size:14px;white-space:pre-wrap}
audio{width:100%;margin-top:14px} .small{font-size:12px;color:#7b8493;margin-top:8px;line-height:1.45}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🇻🇳 Piper TTS</h1>
<p class="sub">Chỉ cần chọn file <b>.onnx</b>. Cấu hình tiếng Việt đã được tích hợp sẵn.</p>

<div class="drop">
  <b>Model Piper</b><br><br>
  <input id="modelFile" type="file" accept=".onnx,application/octet-stream">
  <div id="fileName" class="small">Chưa chọn model.</div>
</div>

<label for="text">Văn bản</label>
<textarea id="text" placeholder="Nhập văn bản tiếng Việt...">Xin chào! Đây là Piper TTS tiếng Việt.</textarea>

<div class="row">
  <div>
    <label for="speaker">Speaker</label>
    <select id="speaker"></select>
  </div>
  <div>
    <label for="length">Tốc độ</label>
    <select id="length">
      <option value="0.75">Nhanh</option>
      <option value="0.9">Hơi nhanh</option>
      <option value="1" selected>Bình thường</option>
      <option value="1.15">Hơi chậm</option>
      <option value="1.3">Chậm</option>
    </select>
  </div>
</div>

<div class="buttons">
  <button class="primary" id="speak">▶ Tạo giọng nói</button>
  <button class="secondary" id="stop">■ Dừng</button>
  <button class="secondary" id="download" disabled>⬇ Tải WAV</button>
</div>

<div id="status" class="status">Chưa tải model.</div>
<audio id="audio" controls></audio>
<div class="small">Model chạy cục bộ trong trình duyệt. File ONNX không được tải lên server.</div>
</div></div>

<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/+esm";
import { createPiperPhonemize } from "./piper.js";

const CONFIG = {"audio": {"sample_rate": 16000, "quality": "x_low"}, "espeak": {"voice": "vi"}, "inference": {"noise_scale": 0.667, "length_scale": 1, "noise_w": 0.8}, "num_speakers": 65, "speaker_id_map": {"VIVOSSPK13": 0, "VIVOSSPK14": 1, "VIVOSSPK15": 2, "VIVOSSPK16": 3, "VIVOSSPK17": 4, "VIVOSSPK18": 5, "VIVOSSPK19": 6, "VIVOSSPK20": 7, "VIVOSSPK21": 8, "VIVOSSPK22": 9, "VIVOSSPK26": 10, "VIVOSSPK34": 11, "VIVOSSPK40": 12, "VIVOSSPK41": 13, "VIVOSSPK42": 14, "VIVOSSPK43": 15, "VIVOSSPK44": 16, "VIVOSSPK45": 17, "VIVOSSPK46": 18, "VIVOSSPK38": 19, "VIVOSSPK31": 20, "VIVOSSPK35": 21, "VIVOSSPK01": 22, "VIVOSSPK02": 23, "VIVOSSPK03": 24, "VIVOSSPK04": 25, "VIVOSSPK05": 26, "VIVOSSPK06": 27, "VIVOSSPK07": 28, "VIVOSSPK08": 29, "VIVOSSPK09": 30, "VIVOSSPK10": 31, "VIVOSSPK11": 32, "VIVOSSPK12": 33, "VIVOSSPK27": 34, "VIVOSSPK36": 35, "VIVOSSPK33": 36, "VIVOSSPK32": 37, "VIVOSSPK29": 38, "VIVOSSPK39": 39, "VIVOSSPK25": 40, "VIVOSSPK28": 41, "VIVOSSPK30": 42, "VIVOSSPK37": 43, "VIVOSSPK23": 44, "VIVOSSPK24": 45, "VIVOSDEV02": 46, "VIVOSDEV03": 47, "VIVOSDEV01": 48, "VIVOSDEV04": 49, "VIVOSDEV05": 50, "VIVOSDEV06": 51, "VIVOSDEV07": 52, "VIVOSDEV08": 53, "VIVOSDEV09": 54, "VIVOSDEV10": 55, "VIVOSDEV11": 56, "VIVOSDEV12": 57, "VIVOSDEV13": 58, "VIVOSDEV14": 59, "VIVOSDEV15": 60, "VIVOSDEV16": 61, "VIVOSDEV17": 62, "VIVOSDEV18": 63, "VIVOSDEV19": 64}};
const ONNX_WASM_BASE = "https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.18.0/";
const PIPER_WASM = "https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.wasm";
const PIPER_DATA = "https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.data";

const $ = id => document.getElementById(id);
const status = $("status");
const speaker = $("speaker");
let session = null, currentUrl = null, lastBlob = null, busy = false;

for (const [name,id] of Object.entries(CONFIG.speaker_id_map)) {
  const o=document.createElement("option"); o.value=id; o.textContent=`${name} (#${id})`; speaker.appendChild(o);
}
speaker.value = "0";

$("modelFile").addEventListener("change", e => {
  const f=e.target.files[0];
  $("fileName").textContent=f ? `${f.name} — ${(f.size/1024/1024).toFixed(1)} MB` : "Chưa chọn model.";
  session=null; lastBlob=null; $("download").disabled=true;
  status.textContent=f ? "Đã chọn model. Bấm Tạo giọng nói." : "Chưa tải model.";
});

function pcmToWav(pcm, sampleRate) {
  const buffer=new ArrayBuffer(44+pcm.length*2), view=new DataView(buffer);
  const write=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  write(0,"RIFF"); view.setUint32(4,36+pcm.length*2,true); write(8,"WAVE");
  write(12,"fmt "); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,1,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true);
  view.setUint16(32,2,true); view.setUint16(34,16,true); write(36,"data");
  view.setUint32(40,pcm.length*2,true);
  let p=44; for(let i=0;i<pcm.length;i++){let x=Math.max(-1,Math.min(1,pcm[i]));view.setInt16(p,x<0?x*32768:x*32767,true);p+=2}
  return new Blob([buffer],{type:"audio/wav"});
}

async function makeSession(modelBytes) {
  ort.env.allowLocalModels=false;
  ort.env.wasm.numThreads=Math.max(1, Math.min(4, navigator.hardwareConcurrency||2));
  ort.env.wasm.wasmPaths=ONNX_WASM_BASE;
  status.textContent="Đang mở model ONNX...";
  const s=await ort.InferenceSession.create(modelBytes, {
    executionProviders:["wasm"],
    graphOptimizationLevel:"all"
  });
  return s;
}

async function phonemize(text) {
  return await new Promise(async (resolve,reject)=>{
    try {
      const module=await createPiperPhonemize({
        print:data=>{try{resolve(JSON.parse(data).phoneme_ids)}catch(e){reject(e)}},
        printErr:msg=>console.warn("phonemizer:",msg),
        locateFile:url=>url.endsWith(".wasm")?PIPER_WASM:url.endsWith(".data")?PIPER_DATA:url
      });
      module.callMain(["-l",CONFIG.espeak.voice,"--input",JSON.stringify([{text:text.trim()}]),"--espeak_data","/espeak-ng-data"]);
    } catch(e) { reject(e); }
  });
}

$("speak").onclick=async()=>{
  if(busy)return;
  const file=$("modelFile").files[0], text=$("text").value.trim();
  if(!file){status.textContent="❌ Hãy chọn file .onnx trước.";return}
  if(!text){status.textContent="❌ Hãy nhập văn bản.";return}
  busy=true; $("speak").disabled=true;
  try {
    if(!session) session=await makeSession(await file.arrayBuffer());
    status.textContent="Đang chuyển tiếng Việt thành phoneme...";
    const ids=await phonemize(text);
    if(!ids?.length)throw new Error("Không tạo được phoneme từ văn bản.");
    const sid=Number(speaker.value);
    const feeds={
      input:new ort.Tensor("int64",BigInt64Array.from(ids.map(Number)),[1,ids.length]),
      input_lengths:new ort.Tensor("int64",BigInt64Array.from([ids.length]),[1]),
      scales:new ort.Tensor("float32",Float32Array.from([CONFIG.inference.noise_scale,Number($("length").value),CONFIG.inference.noise_w]),[3]),
      sid:new ort.Tensor("int64",BigInt64Array.from([sid]),[1])
    };
    status.textContent="Đang tổng hợp giọng nói...";
    const out=await session.run(feeds);
    const pcm=out.output.data;
    lastBlob=pcmToWav(pcm,CONFIG.audio.sample_rate);
    if(currentUrl)URL.revokeObjectURL(currentUrl);
    currentUrl=URL.createObjectURL(lastBlob);
    $("audio").src=currentUrl; $("download").disabled=false;
    status.textContent=`✅ Hoàn tất — speaker ${sid}.`;
    await $("audio").play().catch(()=>{});
  } catch(e) {
    console.error(e);
    status.textContent="❌ Lỗi: "+(e?.message||e);
  } finally {busy=false;$("speak").disabled=false}
};

$("stop").onclick=()=>{$("audio").pause();$("audio").currentTime=0;status.textContent="Đã dừng."};
$("download").onclick=()=>{
  if(!lastBlob)return;
  const a=document.createElement("a");a.href=currentUrl;a.download="piper-vietnamese.wav";a.click();
};
</script>
</body>
</html>
