<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Camera AI - Quét vật thể</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body {
    min-height:100vh; background: linear-gradient(135deg, #0f172a, #1e293b);
    display:flex; align-items:center; justify-content:center; padding:20px;
    color:#e2e8f0;
  }
  .app { width:100%; max-width:900px; background:rgba(30,41,59,0.8);
    border-radius:24px; padding:24px; border:1px solid #334155;
    box-shadow:0 25px 50px -12px rgba(0,0,0,0.7); }
  h1 { font-size:1.6rem; margin-bottom:6px; color:#93c5fd; }
  .sub { color:#94a3b8; margin-bottom:18px; font-size:.9rem; }

  .wrapper { position:relative; width:100%; aspect-ratio:4/3;
    background:#000; border-radius:16px; overflow:hidden;
    border:2px solid #334155; }
  video, canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  video { transform: scaleX(-1); z-index:1; }
  canvas { transform: scaleX(-1); z-index:2; pointer-events:none; }

  .bar { margin-top:16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  button {
    background:#2563eb; color:white; border:none; padding:12px 24px;
    border-radius:40px; font-size:.95rem; font-weight:600; cursor:pointer;
    transition:.2s;
  }
  button:hover:not(:disabled) { background:#1d4ed8; transform:translateY(-2px); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.stop { background:#dc2626; }
  button.stop:hover { background:#b91c1c; }

  .status { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:.85rem; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ef4444; }
  .dot.on { background:#22c55e; box-shadow:0 0 10px #22c55e; }
  .dot.load { background:#eab308; animation:pulse 1s infinite; }
  @keyframes pulse { 50%{ opacity:.4; } }

  .log { margin-top:14px; background:#0f172a; border:1px solid #1e3a5f;
    border-radius:10px; padding:10px 14px; font-family:monospace;
    font-size:.75rem; color:#7dd3fc; max-height:100px; overflow:auto; white-space:pre-wrap; }

  .slider { display:flex; align-items:center; gap:8px; background:#1e293b;
    padding:8px 16px; border-radius:40px; font-size:.85rem; }
  input[type=range] { accent-color:#3b82f6; width:100px; }
</style>
</head>
<body>
<div class="app">
  <h1>📷 Camera AI - Quét vật thể</h1>
  <div class="sub">Nhận diện 80 loại vật thể: người, chó, mèo, điện thoại, cốc, bàn, ghế, xe...</div>

  <div class="wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="bar">
    <button id="startBtn" disabled>⏳ Đang tải AI...</button>
    <button id="stopBtn" class="stop" disabled>⏹ Dừng</button>
    <div class="slider">
      <span>Ngưỡng:</span>
      <input type="range" id="slider" min="0.1" max="0.9" step="0.05" value="0.4">
      <span id="sliderVal">40%</span>
    </div>
    <div class="status">
      <span class="dot load" id="dot"></span>
      <span id="statusText">Đang tải model...</span>
    </div>
  </div>

  <div class="log" id="log">Khởi động...</div>
</div>

<!-- TF.js + COCO-SSD: hai script này load model tự động -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
(function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const logEl = document.getElementById('log');
  const slider = document.getElementById('slider');
  const sliderVal = document.getElementById('sliderVal');

  let stream = null, model = null, modelReady = false;
  let isRunning = false, isDetecting = false, timer = null;
  let threshold = 0.4, frame = 0;

  function log(msg){
    const t = new Date().toLocaleTimeString();
    logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent.split('\n').slice(0,6).join('\n');
  }

  slider.addEventListener('input', () => {
    threshold = parseFloat(slider.value);
    sliderVal.textContent = Math.round(threshold*100)+'%';
  });

  // Kiểm tra thư viện có load được không
  function checkLibs(){
    if (typeof tf === 'undefined') { log('❌ TF.js không tải được - kiểm tra mạng'); return false; }
    if (typeof cocoSsd === 'undefined') { log('❌ COCO-SSD không tải được - kiểm tra mạng'); return false; }
    return true;
  }

  // Tải model
  async function loadModel(){
    if (!checkLibs()) {
      statusText.textContent = 'Lỗi: không tải được thư viện';
      return;
    }
    try {
      log('Bắt đầu tải model COCO-SSD...');
      await tf.ready();
      log('Backend: ' + tf.getBackend());

      model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
      modelReady = true;
      startBtn.disabled = false;
      startBtn.textContent = '▶ Bật Camera';
      dot.classList.remove('load');
      statusText.textContent = 'Model sẵn sàng';
      log('✅ Model đã tải xong');
    } catch(e){
      log('❌ Lỗi model: ' + e.message);
      statusText.textContent = 'Lỗi tải model';
    }
  }

  // Bật camera
  async function startAll(){
    try {
      startBtn.disabled = true;
      log('Mở camera...');
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;

      await new Promise(r => {
        if (video.videoWidth > 0) return r();
        video.onloadedmetadata = () => r();
      });
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      log('📐 ' + video.videoWidth + 'x' + video.videoHeight);

      dot.classList.add('on');
      statusText.textContent = 'Đang quét...';
      isRunning = true;
      stopBtn.disabled = false;
      loop();
    } catch(e){
      log('❌ Camera: ' + e.message);
      statusText.textContent = 'Lỗi camera';
      startBtn.disabled = false;
      alert('Không mở được camera: ' + e.message + '\n\nLưu ý: mở file bằng cách nhấp đôi, KHÔNG chạy qua server.');
    }
  }

  function stopAll(){
    isRunning = false; isDetecting = false;
    if (timer) { clearTimeout(timer); timer = null; }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    dot.classList.remove('on');
    statusText.textContent = 'Đã dừng';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    log('⏹ Đã dừng');
  }

  async function loop(){
    if (!isRunning) return;
    if (isDetecting || !modelReady || video.readyState < 2){
      timer = setTimeout(loop, 100); return;
    }
    isDetecting = true;
    frame++;

    try {
      const preds = await model.detect(video, 20, threshold);
      isDetecting = false;
      ctx.clearRect(0,0,canvas.width,canvas.height);

      if (frame % 15 === 0) log(`🎯 Frame ${frame}: ${preds.length} vật thể`);

      preds.forEach(p => {
        const [x,y,w,h] = p.bbox;
        const conf = p.score;
        const hue = Math.round(120 - conf*90);
        const color = `hsl(${hue},90%,58%)`;

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(3, canvas.width/350);
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
        ctx.strokeRect(x,y,w,h);
        ctx.restore();

        const fs = Math.max(15, Math.round(canvas.width/45));
        ctx.font = `bold ${fs}px 'Segoe UI',sans-serif`;
        const text = `${p.class} ${Math.round(conf*100)}%`;
        const tw = ctx.measureText(text).width;
        const pad = fs*0.5;
        let ly = y - pad - 4;
        if (ly < fs) ly = y + h + fs + pad;

        ctx.save();
        ctx.fillStyle = 'rgba(10,15,25,0.85)';
        ctx.beginPath();
        ctx.roundRect(x, ly-fs, tw+pad*2, fs+pad, 8);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.fillText(text, x+pad, ly-pad/2);
        ctx.restore();
      });

      timer = setTimeout(loop, 80);
    } catch(e){
      isDetecting = false;
      log('❌ Detect: ' + e.message);
      timer = setTimeout(loop, 500);
    }
  }

  // Polyfill roundRect
  if (!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if (w<2*r) r=w/2; if (h<2*r) r=h/2;
      this.moveTo(x+r,y); this.lineTo(x+w-r,y);
      this.quadraticCurveTo(x+w,y,x+w,y+r);
      this.lineTo(x+w,y+h-r);
      this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      this.lineTo(x+r,y+h);
      this.quadraticCurveTo(x,y+h,x,y+h-r);
      this.lineTo(x,y+r);
      this.quadraticCurveTo(x,y,x+r,y);
      return this;
    };
  }

  startBtn.addEventListener('click', startAll);
  stopBtn.addEventListener('click', stopAll);
  window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (timer) clearTimeout(timer);
  });

  loadModel();
})();
</script>
</body>
</html>
