<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI · Ảo Ma</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
  :root {
    --neon1:#00f0ff;
    --neon2:#ff00e5;
    --neon3:#7d00ff;
    --neon4:#00ff88;
    --bg:#000;
    --panel:rgba(10,0,25,.7);
    --text:#e6f7ff;
    --dim:#7a8ba0;
  }

  html,body{
    height:100%;
    background:#000;
    color:var(--text);
    overflow:hidden;
    font-size:14px;
  }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
    position:relative;
  }

  /* ================== ẢO MA BACKGROUND ================== */
  .grid-bg{
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(0,240,255,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,229,.08) 1px, transparent 1px);
    background-size:44px 44px;
    animation:gridMove 14s linear infinite;
    mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
  }
  @keyframes gridMove{
    from{background-position:0 0,0 0;}
    to  {background-position:44px 44px,44px 44px;}
  }

  .scanline{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0px,
      rgba(255,255,255,0) 3px,
      rgba(0,240,255,.03) 4px
    );
    animation:scan 8s linear infinite;
  }
  @keyframes scan{
    from{background-position:0 0;}
    to  {background-position:0 100px;}
  }

  .blob{
    position:fixed; z-index:0;
    border-radius:50%;
    filter:blur(90px);
    opacity:.55;
    pointer-events:none;
  }
  .blob1{ width:520px; height:520px; background:#7d00ff; top:-180px; left:-180px; animation:blob1 18s ease-in-out infinite; }
  .blob2{ width:480px; height:480px; background:#ff00e5; bottom:-160px; right:-160px; animation:blob2 22s ease-in-out infinite; }
  .blob3{ width:420px; height:420px; background:#00f0ff; top:40%; left:45%; animation:blob3 20s ease-in-out infinite; }

  @keyframes blob1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(140px,90px) scale(1.15);}
  }
  @keyframes blob2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-120px,-80px) scale(1.2);}
  }
  @keyframes blob3{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    33%{transform:translate(-30%,-70%) scale(.9);}
    66%{transform:translate(-70%,-30%) scale(1.1);}
  }

  /* ================== KHUNG CHAT ================== */
  .chat{
    position:relative; z-index:5;
    width:100%; max-width:760px;
    height:94vh; max-height:900px;
    background:var(--panel);
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(0,240,255,.25);
    border-radius:22px;
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(255,0,229,.15),
      0 0 60px rgba(125,0,255,.5),
      0 0 120px rgba(0,240,255,.25),
      inset 0 0 80px rgba(125,0,255,.08);
    animation:chatIn .8s cubic-bezier(.16,1,.3,1);
  }

  /* viền neon chạy quanh khung */
  .chat::before{
    content:'';
    position:absolute; inset:-2px;
    border-radius:24px;
    padding:2px;
    background:conic-gradient(from 0deg, #00f0ff, #ff00e5, #7d00ff, #00ff88, #00f0ff);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    animation:spinBorder 6s linear infinite;
    pointer-events:none;
    opacity:.85;
  }
  @keyframes spinBorder{ to{ transform:rotate(360deg); } }

  @keyframes chatIn{
    from{opacity:0; transform:translateY(40px) scale(.94);}
    to  {opacity:1; transform:translateY(0) scale(1);}
  }

  /* ================== HEADER ================== */
  .head{
    display:flex; align-items:center; gap:14px;
    padding:16px 20px;
    background:linear-gradient(180deg, rgba(0,240,255,.06), transparent);
    border-bottom:1px solid rgba(0,240,255,.18);
    position:relative;
  }
  .head::after{
    content:'';
    position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg, transparent, #00f0ff, #ff00e5, transparent);
    animation:headLine 4s linear infinite;
  }
  @keyframes headLine{
    0%{background-position:-200% 0;}
    100%{background-position:200% 0;}
  }
  .head::after{ background-size:200% 100%; }

  .avatar{
    position:relative;
    width:48px; height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,#00f0ff,#7d00ff,#ff00e5);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#fff;
    cursor:pointer;
    box-shadow:0 0 22px rgba(0,240,255,.6), inset 0 0 12px rgba(255,255,255,.2);
    flex-shrink:0;
    transition:transform .25s;
  }
  .avatar:hover{ transform:scale(1.08) rotate(-6deg); }
  .avatar::after{
    content:'';
    position:absolute; inset:-5px;
    border-radius:18px;
    border:2px solid rgba(0,240,255,.5);
    animation:ringPulse 2.2s ease-out infinite;
  }
  @keyframes ringPulse{
    0%{ transform:scale(.85); opacity:1; }
    100%{ transform:scale(1.4); opacity:0; }
  }

  .head-info h1{
    font-size:16px;
    font-weight:700;
    letter-spacing:.5px;
    background:linear-gradient(90deg,#00f0ff,#ff00e5,#00f0ff);
    background-size:200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
  }
  @keyframes shine{
    to{ background-position:200% center; }
  }
  .head-info p{
    font-size:11.5px; color:var(--dim);
    display:flex; align-items:center; gap:6px;
    margin-top:3px;
    font-family:'Courier New', monospace;
    letter-spacing:.5px;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--neon4);
    box-shadow:0 0 10px var(--neon4);
    animation:blinkDot 1.3s infinite;
  }
  @keyframes blinkDot{ 50%{ opacity:.3; } }

  .head-actions{ margin-left:auto; display:flex; gap:8px; }

  .icon-btn{
    width:38px; height:38px;
    border-radius:12px;
    border:1px solid rgba(0,240,255,.25);
    background:rgba(0,240,255,.05);
    color:var(--neon1);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .25s;
    font-size:15px;
  }
  .icon-btn:hover{
    background:rgba(0,240,255,.15);
    border-color:var(--neon1);
    box-shadow:0 0 18px rgba(0,240,255,.5);
    transform:translateY(-1px);
  }
  .icon-btn.danger{ color:#ff4d6d; border-color:rgba(255,77,109,.3); }
  .icon-btn.danger:hover{
    background:rgba(255,77,109,.15);
    border-color:#ff4d6d;
    box-shadow:0 0 18px rgba(255,77,109,.5);
  }

  /* ================== CHAT BOX ================== */
  .box{
    flex:1; overflow-y:auto;
    padding:22px 20px;
    display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  .box::-webkit-scrollbar{ width:6px; }
  .box::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#00f0ff,#ff00e5);
    border-radius:10px;
  }

  .msg{
    display:flex; gap:10px;
    animation:msgIn .45s cubic-bezier(.16,1,.3,1);
  }
  @keyframes msgIn{
    from{ opacity:0; transform:translateY(16px) scale(.96); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }
  .msg.user{ justify-content:flex-end; }
  .msg.bot{ justify-content:flex-start; }

  .bubble{
    max-width:78%;
    padding:12px 16px;
    border-radius:16px;
    font-size:14px;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
    position:relative;
  }

  .msg.bot .bubble{
    background:linear-gradient(135deg, rgba(0,240,255,.08), rgba(125,0,255,.08));
    border:1px solid rgba(0,240,255,.28);
    border-bottom-left-radius:4px;
    color:var(--text);
    box-shadow:0 0 24px rgba(0,240,255,.12), inset 0 0 22px rgba(0,240,255,.04);
  }

  .msg.user .bubble{
    background:linear-gradient(135deg, #7d00ff, #ff00e5);
    border:1px solid rgba(255,0,229,.5);
    border-bottom-right-radius:4px;
    color:#fff;
    box-shadow:0 0 28px rgba(255,0,229,.5);
  }

  /* typing */
  .typing{ display:flex; gap:5px; padding:15px 18px; }
  .typing span{
    width:8px; height:8px; border-radius:50%;
    background:var(--neon1);
    box-shadow:0 0 10px var(--neon1);
    animation:bnc 1.4s infinite;
  }
  .typing span:nth-child(2){ background:var(--neon2); box-shadow:0 0 10px var(--neon2); animation-delay:.2s; }
  .typing span:nth-child(3){ background:var(--neon3); box-shadow:0 0 10px var(--neon3); animation-delay:.4s; }
  @keyframes bnc{
    0%,60%,100%{ transform:translateY(0); opacity:.4; }
    30%{ transform:translateY(-9px); opacity:1; }
  }

  /* ================== INPUT ================== */
  .input-wrap{
    padding:14px 18px 18px;
    border-top:1px solid rgba(0,240,255,.15);
    background:linear-gradient(0deg, rgba(0,240,255,.05), transparent);
    display:flex; gap:10px; align-items:center;
  }

  .input-shell{
    flex:1;
    display:flex; align-items:center;
    padding:4px 6px 4px 16px;
    border-radius:16px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(0,240,255,.2);
    transition:all .3s;
    position:relative;
    overflow:hidden;
  }
  .input-shell:focus-within{
    border-color:var(--neon1);
    box-shadow:0 0 0 3px rgba(0,240,255,.15), 0 0 30px rgba(0,240,255,.35);
    background:rgba(0,240,255,.06);
  }
  .input-shell::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(0,240,255,.15), transparent);
    transform:translateX(-100%);
    transition:transform .6s;
    pointer-events:none;
  }
  .input-shell:focus-within::before{ transform:translateX(100%); }

  #inp{
    flex:1;
    background:transparent; border:none; outline:none;
    color:var(--text);
    font-size:14.5px;
    padding:12px 0;
    font-family:inherit;
  }
  #inp::placeholder{ color:var(--dim); }

  /* NÚT GỬI RÕ RÀNG */
  .send-btn{
    width:52px; height:52px;
    border-radius:16px;
    border:1px solid rgba(0,240,255,.5);
    background:linear-gradient(135deg,#00f0ff,#7d00ff,#ff00e5);
    background-size:200% 200%;
    color:#fff;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    transition:all .25s;
    box-shadow:0 0 24px rgba(0,240,255,.55), 0 0 48px rgba(255,0,229,.3);
    animation:gradShift 4s ease infinite;
    flex-shrink:0;
  }
  @keyframes gradShift{
    0%,100%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
  }
  .send-btn:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 0 32px rgba(0,240,255,.8), 0 0 60px rgba(255,0,229,.6);
  }
  .send-btn:active{ transform:scale(.94); }
  .send-btn:disabled{ opacity:.4; cursor:not-allowed; animation:none; }

  /* ================== MODEL PANEL (ẨN) ================== */
  .model-panel{
    position:absolute; inset:0;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    z-index:50;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:30px;
    opacity:0; pointer-events:none;
    transition:opacity .35s;
  }
  .model-panel.show{ opacity:1; pointer-events:auto; }

  .model-card{
    width:100%; max-width:520px;
    max-height:80%;
    background:rgba(10,0,25,.95);
    border:1px solid rgba(0,240,255,.35);
    border-radius:20px;
    padding:24px;
    box-shadow:0 0 60px rgba(125,0,255,.6);
    display:flex; flex-direction:column;
    animation:cardIn .4s cubic-bezier(.16,1,.3,1);
  }
  @keyframes cardIn{
    from{ transform:translateY(20px) scale(.94); opacity:0; }
    to  { transform:translateY(0) scale(1); opacity:1; }
  }

  .model-card h2{
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--neon1);
    text-shadow:0 0 12px var(--neon1);
    margin-bottom:6px;
    font-family:'Courier New', monospace;
  }
  .model-card .sub{
    font-size:12px; color:var(--dim);
    margin-bottom:18px;
    font-family:'Courier New', monospace;
  }

  .model-list{
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
    padding-right:6px;
  }
  .model-list::-webkit-scrollbar{ width:5px; }
  .model-list::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#00f0ff,#ff00e5);
    border-radius:8px;
  }

  .model-item{
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(0,240,255,.15);
    background:rgba(0,240,255,.03);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    transition:all .2s;
    display:flex; align-items:center; gap:10px;
    font-family:'Courier New', monospace;
  }
  .model-item:hover{
    background:rgba(0,240,255,.1);
    border-color:var(--neon1);
    transform:translateX(4px);
  }
  .model-item.active{
    background:linear-gradient(135deg, rgba(0,240,255,.15), rgba(255,0,229,.15));
    border-color:var(--neon2);
    box-shadow:0 0 20px rgba(255,0,229,.35);
  }
  .model-item .tag{
    margin-left:auto;
    font-size:10px;
    padding:2px 8px;
    border-radius:8px;
    background:rgba(0,255,136,.15);
    color:var(--neon4);
    border:1px solid rgba(0,255,136,.4);
    letter-spacing:1px;
  }

  .close-model{
    margin-top:16px;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,0,229,.4);
    background:rgba(255,0,229,.08);
    color:var(--neon2);
    font-weight:600;
    letter-spacing:2px;
    cursor:pointer;
    transition:all .25s;
    font-family:'Courier New', monospace;
    text-transform:uppercase;
    font-size:12px;
  }
  .close-model:hover{
    background:rgba(255,0,229,.2);
    box-shadow:0 0 24px rgba(255,0,229,.6);
  }

  /* ================== TOAST ================== */
  .toast{
    position:fixed; top:22px; left:50%;
    transform:translateX(-50%) translateY(-120px);
    background:rgba(10,0,25,.95);
    border:1px solid rgba(0,240,255,.5);
    color:var(--text);
    padding:12px 22px;
    border-radius:14px;
    font-size:13px;
    z-index:9999;
    transition:transform .4s cubic-bezier(.16,1,.3,1);
    box-shadow:0 0 40px rgba(0,240,255,.6);
    backdrop-filter:blur(20px);
    font-family:'Courier New', monospace;
    letter-spacing:.5px;
    max-width:90vw;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }

  @media (max-width:600px){
    body{ padding:0; }
    .chat{ height:100vh; max-height:none; border-radius:0; }
    .bubble{ max-width:85%; }
  }
</style>
</head>
<body>

<!-- ẢO MA BACKGROUND -->
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<!-- KHUNG CHAT -->
<div class="chat">
  <div class="head">
    <div class="avatar" id="avatar" title="···">✦</div>
    <div class="head-info">
      <h1>AI ASSISTANT</h1>
      <p><span class="dot"></span><span id="statusTxt">ONLINE · SẴN SÀNG</span></p>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="modelBtn" title="Model">⚙</button>
      <button class="icon-btn danger" id="clearBtn" title="Xóa hội thoại">✕</button>
    </div>
  </div>

  <div class="box" id="box">
    <div class="msg bot">
      <div class="bubble">Xin chào! Tôi có thể giúp gì cho bạn? ✨</div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-shell">
      <input id="inp" type="text" placeholder="Nhập tin nhắn..." autocomplete="off">
    </div>
    <button class="send-btn" id="sendBtn" title="Gửi">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

  <!-- MODEL PANEL (ẩn) -->
  <div class="model-panel" id="modelPanel">
    <div class="model-card">
      <h2>◈ MODEL SELECT</h2>
      <div class="sub">Chỉ hiển thị model MIỄN PHÍ</div>
      <div class="model-list" id="modelList"></div>
      <button class="close-model" id="closeModel">ĐÓNG</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   CẤU HÌNH
   ========================================================== */
const API_BASE = "https://api.xkiro.com/v1";
const LS_KEY = "xm_key";
const LS_MODEL = "xm_model";

const state = {
  key: localStorage.getItem(LS_KEY) || "",
  model: localStorage.getItem(LS_MODEL) || "",
  messages: [],
  sending: false,
  freeModels: [],
};

/* ==========================================================
   DOM
   ========================================================== */
const box        = document.getElementById("box");
const inp        = document.getElementById("inp");
const sendBtn    = document.getElementById("sendBtn");
const clearBtn   = document.getElementById("clearBtn");
const avatar     = document.getElementById("avatar");
const modelBtn   = document.getElementById("modelBtn");
const modelPanel = document.getElementById("modelPanel");
const modelList  = document.getElementById("modelList");
const closeModel = document.getElementById("closeModel");
const statusTxt  = document.getElementById("statusTxt");
const toast      = document.getElementById("toast");

/* ==========================================================
   TOAST
   ========================================================== */
function showToast(txt, ms = 2400) {
  toast.textContent = txt;
  toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove("show"), ms);
}

/* ==========================================================
   MESSAGE RENDER
   ========================================================== */
function addMsg(role, text) {
  const w = document.createElement("div");
  w.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  w.appendChild(b);
  box.appendChild(w);
  box.scrollTop = box.scrollHeight;
  return b;
}

function addTyping() {
  const w = document.createElement("div");
  w.className = "msg bot";
  w.id = "typing";
  w.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  box.appendChild(w);
  box.scrollTop = box.scrollHeight;
}
function rmTyping() { document.getElementById("typing")?.remove(); }

/* ==========================================================
   QUÉT MODEL FREE — ẨN MODEL TRẢ PHÍ
   ========================================================== */
async function scanFreeModels() {
  if (!state.key) return;

  statusTxt.textContent = "ĐANG QUÉT MODEL...";

  try {
    const r = await fetch(`${API_BASE}/models`, {
      headers: { Authorization: `Bearer ${state.key}` },
    });
    if (!r.ok) throw new Error("HTTP " + r.status);

    const data = await r.json();
    const all = data.data || data.models || [];

    // Lọc model FREE — ẩn mọi model trả phí
    const free = all.filter((m) => {
      const id = String(m.id || m.name || "").toLowerCase();

      // Loại model rõ ràng trả phí
      if (m.paid === true) return false;
      if (m.is_free === false) return false;

      // Kiểm tra pricing
      if (m.pricing) {
        const p = m.pricing.prompt ?? m.pricing.input ?? m.pricing;
        const num = parseFloat(p);
        if (!isNaN(num) && num > 0) return false;
        if (!isNaN(num) && num === 0) return true;
      }

      // Nhận diện theo metadata / tên
      if (m.is_free === true) return true;
      if (id.includes("free")) return true;

      // Mặc định: coi là trả phí → ẩn đi
      return false;
    });

    // Fallback nếu API không có metadata
    state.freeModels = free.length
      ? free.map((m) => ({ id: m.id || m.name }))
      : [
          { id: "openai/gpt-5.6-sol" },
          { id: "meta-llama/llama-3.1-8b-instruct" },
          { id: "google/gemini-flash-1.5" },
        ];

    // Chọn model mặc định nếu chưa có
    if (!state.model || !state.freeModels.find((m) => m.id === state.model)) {
      state.model = state.freeModels[0].id;
      localStorage.setItem(LS_MODEL, state.model);
    }

    statusTxt.textContent = "ONLINE · " + shortModel(state.model);
    showToast("✅ Đã kết nối · " + shortModel(state.model));
    renderModelList();
  } catch (e) {
    console.error(e);
    state.freeModels = [
      { id: "openai/gpt-5.6-sol" },
      { id: "meta-llama/llama-3.1-8b-instruct" },
    ];
    if (!state.model) state.model = state.freeModels[0].id;
    statusTxt.textContent = "OFFLINE · DÙNG MẶC ĐỊNH";
    showToast("⚠️ Không quét được model");
    renderModelList();
  }
}

function shortModel(id) {
  if (!id) return "···";
  const parts = id.split("/");
  return parts[parts.length - 1].slice(0, 22);
}

/* ==========================================================
   RENDER DANH SÁCH MODEL (chỉ FREE)
   ========================================================== */
function renderModelList() {
  modelList.innerHTML = "";
  if (!state.freeModels.length) {
    modelList.innerHTML = `<div style="color:#7a8ba0;font-size:12px;text-align:center;padding:20px">
      Chưa có model. Nhập /api &lt;key&gt; để kết nối.
    </div>`;
    return;
  }
  state.freeModels.forEach((m) => {
    const el = document.createElement("div");
    el.className = "model-item" + (m.id === state.model ? " active" : "");
    el.innerHTML = `<span>▸ ${m.id}</span><span class="tag">FREE</span>`;
    el.onclick = () => {
      state.model = m.id;
      localStorage.setItem(LS_MODEL, m.id);
      statusTxt.textContent = "ONLINE · " + shortModel(m.id);
      renderModelList();
      showToast("🔄 Đã đổi model");
    };
    modelList.appendChild(el);
  });
}

/* ==========================================================
   LỆNH ẨN /api  —  KHÔNG HIỆN RA CHAT
   ========================================================== */
async function handleHidden(text) {
  const t = text.trim();

  // /api <key>
  if (/^\/api\s+/i.test(t)) {
    const key = t.replace(/^\/api\s+/i, "").trim();
    if (!key) return false;
    state.key = key;
    localStorage.setItem(LS_KEY, key);
    await scanFreeModels();
    return true;
  }

  // /api  → xóa key
  if (/^\/api$/i.test(t)) {
    state.key = "";
    state.model = "";
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(LS_MODEL);
    state.freeModels = [];
    statusTxt.textContent = "OFFLINE · CHƯA KẾT NỐI";
    renderModelList();
    showToast("🗑 Đã xóa API key");
    return true;
  }

  return false;
}

/* ==========================================================
   GỌI API CHAT
   ========================================================== */
async function chatAPI(userText) {
  if (!state.key) return "⚠️ Chưa cấu hình API. Vui lòng thử lại sau.";
  if (!state.model) await scanFreeModels();

  state.messages.push({ role: "user", content: userText });

  const r = await fetch(`${API_BASE}/chat/completions`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${state.key}`,
    },
    body: JSON.stringify({
      model: state.model,
      messages: state.messages,
    }),
  });

  if (!r.ok) {
    const e = await r.text().catch(() => "");
    throw new Error(`API ${r.status}: ${e.slice(0, 180)}`);
  }

  const data = await r.json();
  const reply =
    data.choices?.[0]?.message?.content ??
    data.choices?.[0]?.text ??
    "(không có phản hồi)";

  state.messages.push({ role: "assistant", content: reply });
  return reply;
}

/* ==========================================================
   GỬI TIN NHẮN
   ========================================================== */
async function sendMessage() {
  if (state.sending) return;
  const text = inp.value.trim();
  if (!text) return;

  inp.value = "";

  // 1) Lệnh ẩn
  const hidden = await handleHidden(text);
  if (hidden) return;

  // 2) Hiển thị
  addMsg("user", text);

  // 3) Gọi API
  state.sending = true;
  sendBtn.disabled = true;
  addTyping();

  try {
    const reply = await chatAPI(text);
    rmTyping();
    addMsg("bot", reply);
  } catch (e) {
    rmTyping();
    addMsg("bot", "❌ Lỗi: " + e.message);
  } finally {
    state.sending = false;
    sendBtn.disabled = false;
    inp.focus();
  }
}

/* ==========================================================
   EVENTS
   ========================================================== */
sendBtn.addEventListener("click", sendMessage);
inp.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

clearBtn.addEventListener("click", () => {
  state.messages = [];
  box.innerHTML = "";
  addMsg("bot", "Đã xóa hội thoại. Bắt đầu lại nhé! ✨");
});

// Mở panel model: nhấn nút ⚙ hoặc GIỮ avatar 500ms
modelBtn.addEventListener("click", () => {
  renderModelList();
  modelPanel.classList.add("show");
});
let holdTimer;
avatar.addEventListener("mousedown", () => {
  holdTimer = setTimeout(() => {
    renderModelList();
    modelPanel.classList.add("show");
  }, 500);
});
avatar.addEventListener("mouseup",    () => clearTimeout(holdTimer));
avatar.addEventListener("mouseleave", () => clearTimeout(holdTimer));

closeModel.addEventListener("click", () => modelPanel.classList.remove("show"));
modelPanel.addEventListener("click", (e) => {
  if (e.target === modelPanel) modelPanel.classList.remove("show");
});

/* ==========================================================
   KHỞI TẠO
   ========================================================== */
(async function init() {
  if (state.key) {
    await scanFreeModels();
  } else {
    statusTxt.textContent = "OFFLINE · CHƯA KẾT NỐI";
    renderModelList();
  }
  inp.focus();
})();
</script>
