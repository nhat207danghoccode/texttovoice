<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xKiro AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#000000;
    --surface:#0a0b10;
    --surface-2:#0f1117;
    --surface-3:#151822;
    --line:rgba(255,255,255,0.06);
    --line-2:rgba(255,255,255,0.1);
    --line-3:rgba(255,255,255,0.16);
    --text:#f5f7ff;
    --text-2:#a8aec0;
    --text-3:#6b7285;
    --text-4:#3d4354;
    --accent:#7c9eff;
    --accent-2:#a78bfa;
    --accent-3:#f0abfc;
    --cyan:#67e8f9;
    --green:#4ade80;
    --red:#fb7185;
    --amber:#fbbf24;
    --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;flex-direction:column;
    position:relative;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"cv11","ss01","ss03";
    letter-spacing:-0.011em;
  }

  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .ambient::before{
    content:'';position:absolute;top:-30%;left:50%;
    width:900px;height:900px;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(124,158,255,0.14),transparent 60%);
    filter:blur(60px);
    animation:ambientDrift 24s ease-in-out infinite;
  }
  .ambient::after{
    content:'';position:absolute;bottom:-40%;right:-10%;
    width:800px;height:800px;
    background:radial-gradient(circle,rgba(167,139,250,0.12),transparent 60%);
    filter:blur(70px);
    animation:ambientDrift 24s ease-in-out infinite reverse;
  }
  @keyframes ambientDrift{
    0%,100%{transform:translateX(-50%) translateY(0) scale(1)}
    50%{transform:translateX(-46%) translateY(-40px) scale(1.15)}
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
    opacity:0.04;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode:overlay;
  }

  /* ===== TOP BAR ===== */
  .topbar{
    position:relative;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;gap:16px;
    border-bottom:1px solid var(--line);
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{
    width:36px;height:36px;border-radius:11px;
    background:linear-gradient(135deg,#7c9eff 0%,#a78bfa 50%,#f0abfc 100%);
    position:relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 8px 24px rgba(124,158,255,0.35),
      inset 0 1px 0 rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .brand-mark::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.5),transparent 60%);
  }
  .brand-mark svg{position:relative;width:20px;height:20px;filter:drop-shadow(0 0 6px rgba(255,255,255,0.8))}
  .brand-text{display:flex;flex-direction:column;line-height:1.15}
  .brand-name{
    font-size:15px;font-weight:700;letter-spacing:-0.02em;
    background:linear-gradient(180deg,#ffffff,#c8d0e8);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .brand-tag{font-size:10px;color:var(--text-3);font-weight:500;letter-spacing:0.05em;text-transform:uppercase}

  .topbar-right{display:flex;align-items:center;gap:10px}
  .status-pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:100px;
    font-size:12px;font-weight:500;
    background:rgba(74,222,128,0.08);
    color:var(--green);
    border:1px solid rgba(74,222,128,0.2);
    transition:all .3s;
    white-space:nowrap;
  }
  .status-pill.err{background:rgba(251,113,133,0.08);color:var(--red);border-color:rgba(251,113,133,0.25)}
  .status-pill.warn{background:rgba(251,191,36,0.08);color:var(--amber);border-color:rgba(251,191,36,0.25)}
  .status-pill .dot{
    width:6px;height:6px;border-radius:50%;background:currentColor;
    box-shadow:0 0 8px currentColor;
    animation:dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

  .icon-btn{
    width:38px;height:38px;border-radius:11px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line-2);
    color:var(--text-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative;overflow:hidden;
  }
  .icon-btn::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,0.06),transparent);
    opacity:0;transition:opacity .3s;
  }
  .icon-btn:hover{
    color:var(--text);
    border-color:var(--line-3);
    background:rgba(255,255,255,0.05);
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .icon-btn:hover::before{opacity:1}
  .icon-btn:active{transform:translateY(0) scale(.96)}
  .icon-btn svg{width:16px;height:16px;position:relative}

  /* ===== STAGE ===== */
  .stage{
    position:relative;z-index:2;
    flex:1;display:flex;flex-direction:column;overflow:hidden;
    max-width:920px;width:100%;margin:0 auto;padding:0 28px;
  }

  /* ===== HERO ===== */
  .hero{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;padding:40px 20px;
    animation:heroIn .9s cubic-bezier(.16,1,.3,1);
  }
  @keyframes heroIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  .hero-visual{
    position:relative;width:200px;height:200px;
    margin-bottom:40px;
    perspective:1200px;
  }
  .diamond-stage{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transform:rotateX(-20deg) rotateY(0deg);
    animation:stageSpin 20s linear infinite;
  }
  @keyframes stageSpin{
    from{transform:rotateX(-20deg) rotateY(0deg)}
    to{transform:rotateX(-20deg) rotateY(360deg)}
  }
  .cube{
    position:absolute;top:50%;left:50%;
    width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:14px;
    transform-style:preserve-3d;
    background:linear-gradient(135deg,#7c9eff 0%,#5b7cff 100%);
    box-shadow:
      0 0 30px rgba(124,158,255,0.6),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -20px 40px rgba(0,0,0,0.3);
    border:1px solid rgba(255,255,255,0.15);
  }
  .cube::before{
    content:'';position:absolute;inset:0;border-radius:14px;
    background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.5),transparent 55%);
    pointer-events:none;
  }
  .cube.n{transform:translateZ(-70px) translateY(-72px);background:linear-gradient(135deg,#7c9eff,#4f74ff);animation:float1 4s ease-in-out infinite}
  .cube.e{transform:translateZ(-70px) translateX(72px);background:linear-gradient(135deg,#a78bfa,#8b5cf6);animation:float2 4s ease-in-out infinite;animation-delay:.5s}
  .cube.s{transform:translateZ(-70px) translateY(72px);background:linear-gradient(135deg,#f0abfc,#e879f9);animation:float3 4s ease-in-out infinite;animation-delay:1s}
  .cube.w{transform:translateZ(-70px) translateX(-72px);background:linear-gradient(135deg,#67e8f9,#22d3ee);animation:float4 4s ease-in-out infinite;animation-delay:1.5s}
  .cube.center{
    width:64px;height:64px;margin:-32px 0 0 -32px;
    transform:translateZ(60px);
    background:linear-gradient(135deg,#ffffff 0%,#c8d4ff 30%,#7c9eff 70%,#a78bfa 100%);
    box-shadow:
      0 0 60px rgba(167,139,250,0.7),
      0 0 100px rgba(124,158,255,0.5),
      inset 0 2px 0 rgba(255,255,255,0.9),
      inset 0 -30px 60px rgba(90,60,180,0.5);
    animation:centerFloat 3s ease-in-out infinite;
    z-index:10;
  }
  .cube.center::before{content:'';position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,0.9),transparent 50%)}
  .cube.center::after{
    content:'';position:absolute;top:50%;left:50%;
    width:28px;height:28px;margin:-14px 0 0 -14px;
    background:conic-gradient(from 45deg,
      #7c9eff 0deg 90deg,#a78bfa 90deg 180deg,
      #f0abfc 180deg 270deg,#67e8f9 270deg 360deg);
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    filter:blur(0.5px);
    box-shadow:0 0 24px rgba(255,255,255,0.8);
    animation:diamondPulse 2.5s ease-in-out infinite;
  }
  @keyframes float1{0%,100%{transform:translateZ(-70px) translateY(-72px) scale(1)}50%{transform:translateZ(-58px) translateY(-78px) scale(1.06)}}
  @keyframes float2{0%,100%{transform:translateZ(-70px) translateX(72px) scale(1)}50%{transform:translateZ(-58px) translateX(78px) scale(1.06)}}
  @keyframes float3{0%,100%{transform:translateZ(-70px) translateY(72px) scale(1)}50%{transform:translateZ(-58px) translateY(78px) scale(1.06)}}
  @keyframes float4{0%,100%{transform:translateZ(-70px) translateX(-72px) scale(1)}50%{transform:translateZ(-58px) translateX(-78px) scale(1.06)}}
  @keyframes centerFloat{0%,100%{transform:translateZ(60px) scale(1);filter:brightness(1)}50%{transform:translateZ(80px) scale(1.08);filter:brightness(1.2)}}
  @keyframes diamondPulse{0%,100%{transform:rotate(0deg) scale(1);opacity:1}50%{transform:rotate(180deg) scale(1.15);opacity:0.9}}

  .hero-visual::after{
    content:'';position:absolute;left:50%;bottom:-30px;
    width:180px;height:20px;transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(124,158,255,0.6),transparent 70%);
    filter:blur(16px);
    animation:glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse{0%,100%{opacity:.5;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.2)}}

  .orbit{position:absolute;inset:0;transform-style:preserve-3d;animation:orbitSpin 14s linear infinite}
  .orbit-particle{
    position:absolute;top:50%;left:50%;
    width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;background:var(--cyan);
    box-shadow:0 0 12px var(--cyan),0 0 24px rgba(103,232,249,0.5);
  }
  .orbit-particle:nth-child(1){transform:rotate(0deg) translateX(120px)}
  .orbit-particle:nth-child(2){transform:rotate(120deg) translateX(120px);background:var(--accent);box-shadow:0 0 12px var(--accent),0 0 24px rgba(124,158,255,0.5)}
  .orbit-particle:nth-child(3){transform:rotate(240deg) translateX(120px);background:var(--accent-2);box-shadow:0 0 12px var(--accent-2),0 0 24px rgba(167,139,250,0.5)}
  @keyframes orbitSpin{to{transform:rotate(360deg)}}

  .hero-title{
    font-size:42px;font-weight:700;
    letter-spacing:-0.035em;margin-bottom:14px;line-height:1.1;
    background:linear-gradient(180deg,#ffffff 0%,#a8b4d4 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .hero-title .accent{
    background:linear-gradient(135deg,#7c9eff 0%,#a78bfa 50%,#f0abfc 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    font-weight:800;
  }
  .hero-sub{
    font-size:15px;color:var(--text-2);
    max-width:560px;line-height:1.65;margin-bottom:36px;font-weight:400;
  }
  .hero-sub code{
    display:inline-block;padding:2px 8px;
    background:rgba(124,158,255,0.1);
    border:1px solid rgba(124,158,255,0.25);
    border-radius:6px;font-family:var(--mono);font-size:12px;
    color:var(--accent);font-weight:500;
  }

  .hints{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;max-width:560px;width:100%;
    animation:heroIn 1s .3s cubic-bezier(.16,1,.3,1) both;
  }
  .hint{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line-2);
    border-radius:14px;font-size:13px;
    color:var(--text-2);cursor:pointer;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    text-align:left;position:relative;overflow:hidden;
    font-family:inherit;
  }
  .hint::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(124,158,255,0.1),rgba(167,139,250,0.1));
    opacity:0;transition:opacity .3s;
  }
  .hint > *{position:relative;z-index:1}
  .hint-ico{
    width:32px;height:32px;border-radius:9px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;transition:all .3s;
  }
  .hint:hover{
    color:var(--text);border-color:rgba(124,158,255,0.4);
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(0,0,0,0.4),0 0 0 1px rgba(124,158,255,0.2);
  }
  .hint:hover::before{opacity:1}
  .hint:hover .hint-ico{background:rgba(124,158,255,0.15);border-color:rgba(124,158,255,0.4);transform:scale(1.05)}
  .hint-text{flex:1;line-height:1.4;font-weight:500}
  .hint-arrow{color:var(--text-4);font-size:14px;transition:all .3s}
  .hint:hover .hint-arrow{color:var(--accent);transform:translateX(3px)}

  /* ===== STREAM ===== */
  .stream{
    flex:1;overflow-y:auto;
    padding:28px 0 40px;
    display:flex;flex-direction:column;gap:28px;
    scroll-behavior:smooth;
    mask-image:linear-gradient(180deg,transparent 0,black 28px,black calc(100% - 28px),transparent 100%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,black 28px,black calc(100% - 28px),transparent 100%);
  }
  .stream::-webkit-scrollbar{width:8px}
  .stream::-webkit-scrollbar-track{background:transparent}
  .stream::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}
  .stream::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}

  .turn{display:flex;gap:16px;animation:turnIn .6s cubic-bezier(.16,1,.3,1);max-width:100%}
  @keyframes turnIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
  .turn.user{flex-direction:row-reverse}

  .turn-avatar{
    width:40px;height:40px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .turn.user .turn-avatar{
    background:linear-gradient(135deg,#7c9eff,#a78bfa);
    box-shadow:0 4px 20px rgba(124,158,255,0.4),inset 0 1px 0 rgba(255,255,255,0.3);
    color:#fff;
  }
  .turn.user .turn-avatar::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.5),transparent 55%);
  }
  .turn.user .turn-avatar svg{position:relative;width:18px;height:18px}
  .turn.bot .turn-avatar{
    background:linear-gradient(135deg,rgba(124,158,255,0.15),rgba(167,139,250,0.15));
    border:1px solid rgba(124,158,255,0.35);
    box-shadow:0 0 24px rgba(124,158,255,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .turn.bot .turn-avatar::before{
    content:'';position:absolute;
    width:20px;height:20px;
    background:conic-gradient(from 45deg,
      #7c9eff 0deg 90deg,#a78bfa 90deg 180deg,
      #f0abfc 180deg 270deg,#67e8f9 270deg 360deg);
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    filter:drop-shadow(0 0 6px rgba(167,139,250,0.7));
    animation:diamondRotate 4s linear infinite;
  }
  @keyframes diamondRotate{to{transform:rotate(360deg)}}
  .turn.bot.thinking .turn-avatar{animation:avatarGlow 1.6s ease-in-out infinite}
  @keyframes avatarGlow{
    0%,100%{box-shadow:0 0 24px rgba(124,158,255,0.3),inset 0 1px 0 rgba(255,255,255,0.1)}
    50%{box-shadow:0 0 40px rgba(124,158,255,0.7),0 0 60px rgba(167,139,250,0.4),inset 0 1px 0 rgba(255,255,255,0.15)}
  }

  .turn-content{max-width:78%;display:flex;flex-direction:column;gap:8px}
  .turn.user .turn-content{align-items:flex-end}

  .bubble{
    padding:16px 20px;border-radius:20px;
    font-size:15px;line-height:1.7;
    word-wrap:break-word;overflow-wrap:break-word;
    position:relative;letter-spacing:-0.011em;
  }
  .turn.user .bubble{
    background:linear-gradient(135deg,#7c9eff 0%,#8b5cf6 100%);
    color:#fff;border-bottom-right-radius:6px;
    box-shadow:
      0 12px 36px rgba(124,158,255,0.3),
      0 0 0 1px rgba(255,255,255,0.08) inset,
      0 1px 0 rgba(255,255,255,0.2) inset;
    font-weight:500;
  }
  .turn.bot .bubble{
    background:rgba(15,17,23,0.6);
    border:1px solid var(--line-2);
    border-bottom-left-radius:6px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .turn.bot .bubble strong{color:var(--accent-3);font-weight:600}
  .turn.bot .bubble em{color:var(--text-2);font-style:italic}
  .turn.bot .bubble code{
    background:rgba(0,0,0,0.5);padding:2px 7px;border-radius:6px;
    font-family:var(--mono);font-size:13.5px;
    color:var(--cyan);border:1px solid rgba(103,232,249,0.15);
  }
  .turn.bot .bubble pre{
    background:rgba(0,0,0,0.6);padding:16px 18px;border-radius:14px;
    overflow-x:auto;margin:12px 0;font-size:13px;
    font-family:var(--mono);border:1px solid var(--line-2);
    position:relative;line-height:1.6;
  }
  .turn.bot .bubble pre::before{
    content:'';position:absolute;top:0;left:16px;right:16px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(124,158,255,0.4),transparent);
  }
  .turn.bot .bubble pre code{background:none;padding:0;color:#dce4ff;border:none;font-size:13px}

  .turn-meta{
    font-size:11px;color:var(--text-3);
    font-family:var(--mono);padding:0 8px;
    display:flex;gap:12px;letter-spacing:0;
  }
  .turn.user .turn-meta{color:rgba(255,255,255,0.6)}

  .caret{
    display:inline-block;width:7px;height:17px;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    border-radius:2px;vertical-align:text-bottom;margin-left:3px;
    animation:caretBlink 1s ease-in-out infinite;
    box-shadow:0 0 10px var(--accent);
  }
  @keyframes caretBlink{0%,100%{opacity:1}50%{opacity:.2}}

  .thinking{display:inline-flex;gap:6px;align-items:center;padding:2px 0}
  .thinking-dot{
    width:7px;height:7px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    animation:dotWave 1.4s ease-in-out infinite;
    box-shadow:0 0 8px rgba(124,158,255,0.5);
  }
  .thinking-dot:nth-child(2){animation-delay:.15s}
  .thinking-dot:nth-child(3){animation-delay:.3s}
  @keyframes dotWave{
    0%,60%,100%{transform:translateY(0) scale(.7);opacity:.4}
    30%{transform:translateY(-6px) scale(1);opacity:1}
  }

  .sys-msg{
    align-self:center;font-size:12px;color:var(--text-3);
    padding:7px 18px;border-radius:100px;
    background:rgba(15,17,23,0.5);
    border:1px solid var(--line-2);
    backdrop-filter:blur(10px);
    animation:turnIn .4s ease;font-weight:500;
    display:flex;align-items:center;gap:8px;
  }
  .sys-msg .spinner{
    width:10px;height:10px;border-radius:50%;
    border:1.5px solid rgba(124,158,255,0.3);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== COMPOSER ===== */

  .composer::before{

      rgba(124,158,255,0.6) 0%,

  .composer textarea{
    flex:1;background:transparent;border:none;

  .send-btn{

  /* ===== TOAST ===== */

  .toast::before{
    content:'';position:absolute;

  @keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.95)}to{opacity:1;transform:none}}

  .model-row .m-name{

  @media(max-width:640px){
    .topbar{padding:12px 16px}
    .stage{padding:0 16px}

    .cube{width:44px;height:44px;margin:-22px 0 0 -22px}
    .cube.n{transform:translateZ(-56px) translateY(-58px)}

    .orbit-particle:nth-child(1){transform:rotate(0deg) translateX(96px)}

    .hints{grid-template-columns:1fr}

  }
</style>
</head>
<body>

<div class="ambient"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">

<script>
(function(){
'use strict';

/* ===== UTILS ===== */
const $ = id => document.getElementById(id);
const el = (tag, attrs, children) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (children) (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderMD(text){
  let h = esc(text);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => '<pre><code>' + c.replace(/\n$/,'') + '</code></pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  h = h.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  h = h.replace(/^## (.+)$/gm, '<strong>$1</strong>');
  h = h.replace(/^# (.+)$/gm, '<strong>$1</strong>');
  h = h.replace(/\n/g, '<br>');
  h = h.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (m,c) => '<pre><code>' + c.replace(/<br>/g,'\n') + '</code></pre>');
  return h;
}
const estTokens = s => Math.max(1, Math.ceil((s||'').length / 4));
const fmt = n => {
  if (n == null || isNaN(n)) return '—';
  n = Number(n);
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
};
function toast(msg, type){
  const t = el('div', { class: 'toast ' + (type||'') }, msg);
  $('toastStack').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2600);
}

/* ===== STATE ===== */
const S = {
  baseUrl: 'https://api.xkiro.com/v1',
  apiKey: '',
  authType: 'bearer',
  freeModels: [],
  selectedModel: '',
  streaming: false,
  abort: null,
  history: [],
  msgCount: 0,
  tokens: 0,
  lastLatency: 0,
  systemPrompt: 'Bạn là trợ lý AI hữu ích, trả lời ngắn gọn và chính xác.',
  temperature: 0.7,
  topP: 1.0,
  maxTokens: 0,
  stream: true,
  autoScroll: true,
  lang: 'auto',
  historyLimit: 20,
};
const STORE_KEY = 'xkiro_private_v1';
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    Object.keys(d).forEach(k => { if (k in S && !['abort','streaming'].includes(k)) S[k] = d[k]; });
  }catch(e){}
}

/* ===== API ===== */
function buildHeaders(){
  const h={'Content-Type':'application/json'};
  if(S.authType==='bearer') h['Authorization']='Bearer '+S.apiKey;
  else h['x-api-key']=S.apiKey;
  return h;
}
async function scanModels(){
  const url=S.baseUrl.replace(/\/+$/,'')+'/models';
  const res=await fetch(url,{headers:buildHeaders()});
  if(!res.ok){ const t=await res.text().catch(()=>''); throw new Error('HTTP '+res.status+' '+t.slice(0,150)); }
  const d=await res.json();
  let raw=[];
  if(Array.isArray(d)) raw=d;
  else if(Array.isArray(d.data)) raw=d.data;
  else if(Array.isArray(d.models)) raw=d.models;
  else if(Array.isArray(d.result)) raw=d.result;
  const anyPrice=raw.some(m=>typeof m==='object'&&m&&isFree(m).hasPrice);
  const out=[];
  for(const m of raw){
    const id=typeof m==='string'?m:(m.id||m.model||m.name||m.slug||'');
    if(!id) continue;
    const free=typeof m==='string'?heuristicFree(id):(anyPrice?isFree(m).free:heuristicFree(id));
    if(free) out.push({id});
  }
  const seen=new Set();
  return out.filter(m=>{ if(seen.has(m.id)) return false; seen.add(m.id); return true; });
}
function isFree(m){
  if(typeof m==='string') return {free:heuristicFree(m),hasPrice:false};
  let free=true,hasPrice=false;
  const pf=['price','pricing','input_price','output_price','input','output','cost','input_cost','output_cost','prompt_price','completion_price'];
  for(const f of pf){
    const v=m[f]; if(v==null) continue; hasPrice=true;
    if(typeof v==='number'){ if(v>0) free=false; }
    else if(typeof v==='object'){ if(Object.values(v).map(Number).some(n=>!isNaN(n)&&n>0)) free=false; }
    else if(typeof v==='string'){ const n=parseFloat(v); if(!isNaN(n)&&n>0) free=false; }
  }
  if(m.is_free===false||m.free===false||m.paid===true) free=false;
  if(['premium','paid'].includes(String(m.tier||'').toLowerCase())) free=false;
  if(['premium','paid'].includes(String(m.access||'').toLowerCase())) free=false;
  return {free,hasPrice};
}
const FREE_PATTERNS=[/^mistralai\//i,/^ministral/i,/^devstral/i,/^codestral/i,/^deepseek\//i,/^minimax\//i,/^qwen/i,/(^|\/)[^/]*gemma/i,/-free$/i,/:free$/i];
const heuristicFree = id => FREE_PATTERNS.some(r=>r.test(id));
const PREFERRED = [/deepseek.*v4.*flash/i,/deepseek.*v4/i,/deepseek.*flash/i,/deepseek.*v3/i,/deepseek/i,/mistral.*small/i,/ministral.*8b/i,/mistral/i,/ministral/i,/minimax.*m3/i,/minimax/i,/qwen/i];
function pickBest(list){ for(const r of PREFERRED){ const f=list.find(m=>r.test(m.id)); if(f) return f.id; } return list[0]?.id||''; }

/* ===== UI ===== */
function setStatus(type, text){
  const p=$('statusPill'), t=$('statusText');
  p.className='status-pill '+(type==='ok'?'':type);
  t.textContent=text;
}
function updateModelChip(text, isEmpty){
  const chip=$('modelChip');
  if(isEmpty){
    chip.className='model-chip empty';
    chip.querySelector('.m-id').textContent=text||'đang chờ...';
  }else{
    chip.className='model-chip';
    chip.querySelector('.m-id').textContent=text||S.selectedModel||'—';
  }
}

/* ===== MESSAGES ===== */
function hideHero(){
  const h=$('hero');
  if(h){ h.style.transition='opacity .35s, transform .35s'; h.style.opacity='0'; h.style.transform='scale(.96)'; setTimeout(()=>h.remove(),380); }
  $('stream').style.display='flex';
}
function addSys(text, type, spinner){
  hideHero();
  const m=el('div',{class:'sys-msg'+(type?' '+type:'')});
  if(spinner) m.appendChild(el('span',{class:'spinner'}));
  m.appendChild(document.createTextNode(text));
  $('stream').appendChild(m);
  scrollBottom();
  return m;
}
function addTurn(role, content, opts){
  opts=opts||{};
  hideHero();
  const wrap=el('div',{class:'turn '+role+(opts.thinking?' thinking':'')});
  const avatar=el('div',{class:'turn-avatar'});
  if(role==='user'){
    avatar.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
  }
  const cont=el('div',{class:'turn-content'});
  const bubble=el('div',{class:'bubble'});
  if(opts.thinking){
    bubble.innerHTML='<span class="thinking"><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></span>';
  } else if(role==='bot'){
    bubble.innerHTML=renderMD(content);
  } else {
    bubble.textContent=content;
  }
  cont.appendChild(bubble);
  wrap.appendChild(avatar);
  wrap.appendChild(cont);
  $('stream').appendChild(wrap);
  scrollBottom();
  return {wrap,bubble,cont};
}
function scrollBottom(){
  if(!S.autoScroll) return;
  const s=$('stream');
  s.scrollTop=s.scrollHeight;
}

/* ============================================================
   SLASH COMMANDS — HIDDEN & PRIVATE
   Không expose ra UI, không autocomplete, không hiển thị trong help
   Chỉ những ai biết mới gõ được
   ============================================================ */
const COMMANDS = {
  '/api': async (args) => {
    const parts = args.trim().split(/\s+/).filter(Boolean);
    if (!parts.length){
      return { type:'err', text:'Cú pháp không hợp lệ.' };
    }
    S.apiKey = parts[0];
    if (parts[1]) S.baseUrl = parts[1];
    save();

    const oldKey = S.apiKey;
    // Ẩn input đi — không hiển thị lại key trong chat
    addSys('✓ Đã nhận API key', 'ok');

    // Tự động chạy setup
    await autoSetup();
    return null; // không thêm message nữa, autoSetup đã hiện
  },
  '/model': (args) => {
    if (!S.freeModels.length) return { type:'err', text:'Chưa có model — chạy /api trước.' };
    const q = args.trim();
    if (!q){ openPicker(); return null; }
    const f = S.freeModels.find(m => m.id === q) || S.freeModels.find(m => m.id.toLowerCase().includes(q.toLowerCase()));
    if (!f) return { type:'err', text:'Không tìm thấy model.' };
    S.selectedModel = f.id;
    save();
    updateModelChip();
    return { type:'ok', text:'✓ Đã đổi model.' };
  },
  '/clear': () => {
    S.history = []; S.msgCount = 0; S.tokens = 0; S.lastLatency = 0;
    $('stream').innerHTML = ''; $('stream').style.display = 'none';
    if (!document.getElementById('hero')) location.reload();
    return { type:'ok', text:'✓ Đã xoá lịch sử.' };
  },
  '/reset': () => {
    if (!confirm('Xoá toàn bộ API key và cài đặt?')) return { type:'info', text:'Đã huỷ.' };
    localStorage.removeItem(STORE_KEY);
    location.reload();
    return { type:'ok', text:'Đang khởi động lại...' };
  },
  '/status': () => {
    return { type:'info', text:
      'API Key   : ' + (S.apiKey ? S.apiKey.slice(0,4) + '••••' + S.apiKey.slice(-4) : '(chưa có)') + '\n' +
      'Base URL  : ' + S.baseUrl + '\n' +
      'Model     : ' + (S.selectedModel || '(chưa chọn)') + '\n' +
      'Free count: ' + S.freeModels.length + '\n' +
      'Tin nhắn  : ' + S.msgCount + '\n' +
      'Tokens    : ' + fmt(S.tokens)
    };
  },
};

/* ===== AUTO SETUP (chạy sau khi có key) ===== */
async function autoSetup(){
  setStatus('warn','Đang thiết lập...');
  updateModelChip('đang thiết lập...', true);

  // Bước 1: verify
  const s1 = addSys('Đang xác thực API key...', null, true);
  try{
    const r = await fetch(S.baseUrl.replace(/\/+$/,'')+'/usage', { headers: buildHeaders() });
    if (r.status === 401){
      s1.remove();
      addSys('API key không hợp lệ.', 'err');
      setStatus('err','Key không hợp lệ');
      updateModelChip('key không hợp lệ', true);
      S.apiKey = '';
      save();
      return;
    }
  }catch(e){ /* không chặn */ }
  s1.remove();
  addSys('✓ Đã xác thực API key', 'ok');

  // Bước 2: quét
  const s2 = addSys('Đang tìm model miễn phí...', null, true);
  let list = [];
  try{
    list = await scanModels();
  }catch(e){
    s2.remove();
    addSys('Không quét được model.', 'err');
    setStatus('err','Quét thất bại');
    updateModelChip('quét thất bại', true);
    return;
  }
  if (!list.length){
    s2.remove();
    addSys('Không có model miễn phí nào.', 'err');
    setStatus('err','Không có model free');
    updateModelChip('không có model', true);
    return;
  }
  S.freeModels = list;
  s2.remove();
  addSys('✓ Tìm thấy ' + list.length + ' model miễn phí', 'ok');

  // Bước 3: chọn
  const s3 = addSys('Đang chọn model tốt nhất...', null, true);
  await new Promise(r => setTimeout(r, 300));
  const best = pickBest(list);
  S.selectedModel = best;
  save();
  s3.remove();
  addSys('★ Đã chọn model: ' + best, 'ok');

  // Xong
  await new Promise(r => setTimeout(r, 250));
  addSys('✨ Sẵn sàng trò chuyện!', 'ok');

  setStatus('ok','Sẵn sàng');
  updateModelChip();
  toast('Sẵn sàng — ' + list.length + ' model free', 'ok');
}

/* ===== EXECUTE ===== */
async function executeCommand(text){
  const trimmed = text.trim();
  const spaceIdx = trimmed.indexOf(' ');
  const cmd = (spaceIdx === -1 ? trimmed : trimmed.slice(0, spaceIdx)).toLowerCase();
  const args = spaceIdx === -1 ? '' : trimmed.slice(spaceIdx + 1);
  const fn = COMMANDS[cmd];
  if (!fn) return { type:'err', text:'Lệnh không hợp lệ.' };
  try{
    const result = await fn(args);
    return result;
  }catch(e){
    return { type:'err', text:'Lỗi: ' + e.message };
  }
}

/* ===== CHAT ===== */
async function send(){
  if(S.streaming){ if(S.abort) S.abort.abort(); return; }
  const text=$('input').value.trim();
  if(!text) return;

  // Xoá input trước, không hiển thị lại
  $('input').value='';
  $('input').style.height='auto';
  closeSlashMenu();

  // Slash command?
  if(text.startsWith('/')){
    // KHÔNG hiện tin nhắn user cho lệnh — ẩn hoàn toàn
    const result = await executeCommand(text);
    if (result && result.text){
      addSys(result.text, result.type);
    }
    return;
  }

  // Chat thường
  if(!S.selectedModel){ addSys('Chưa có model — nhập /api để thiết lập.', 'err'); return; }
  if(!S.apiKey){ addSys('Chưa có API key — nhập /api.', 'err'); return; }

  addTurn('user', text);
  S.history.push({role:'user',content:text});
  S.msgCount++;

  const {wrap,bubble,cont}=addTurn('bot','',{thinking:true});
  S.streaming=true;
  const btn=$('btnSend');
  btn.classList.add('stop');
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

  const body={
    model:S.selectedModel,
    messages:[
      ...(S.systemPrompt?[{role:'system',content:S.systemPrompt+(S.lang!=='auto'?'\nLuôn trả lời bằng '+({vi:'Tiếng Việt',en:'English',ja:'日本語'}[S.lang])+'.':'')}]:[]),
      ...S.history.slice(-S.historyLimit)
    ],
    stream:!!S.stream,
    temperature:S.temperature,
    top_p:S.topP,
  };
  if(S.maxTokens>0) body.max_tokens=S.maxTokens;

  S.abort=new AbortController();
  let full='';
  const t0=Date.now();
  let usage=null;

  try{
    const r=await fetch(S.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',headers:buildHeaders(),body:JSON.stringify(body),signal:S.abort.signal
    });
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('HTTP '+r.status+' — '+t.slice(0,200)); }

    if(S.stream && r.body){
      const reader=r.body.getReader();
      const dec=new TextDecoder();
      let buf='';
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop()||'';
        for(const line of lines){
          const t=line.trim();
          if(!t||!t.startsWith('data:')) continue;
          const p=t.slice(5).trim();
          if(p==='[DONE]'){ buf=''; break; }
          try{
            const j=JSON.parse(p);
            const d=j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content ?? j.delta?.text ?? j.content?.[0]?.text ?? '';
            if(d){ full+=d; bubble.innerHTML=renderMD(full)+'<span class="caret"></span>'; wrap.classList.remove('thinking'); scrollBottom(); }
            if(j.usage) usage=j.usage;
          }catch(e){}
        }
      }
      bubble.innerHTML=renderMD(full||'(không có nội dung)');
    } else {
      const d=await r.json();
      full=d.choices?.[0]?.message?.content||'(không có nội dung)';
      usage=d.usage||null;
      bubble.innerHTML=renderMD(full);
    }
    wrap.classList.remove('thinking');

    const dur=((Date.now()-t0)/1000).toFixed(1);
    S.lastLatency=dur;
    const inTok=usage?.prompt_tokens ?? estTokens(text);
    const outTok=usage?.completion_tokens ?? estTokens(full);
    S.tokens+=inTok+outTok;

    cont.appendChild(el('div',{class:'turn-meta'},'⏱ '+dur+'s · '+inTok+' in · '+outTok+' out'));
    if(full) S.history.push({role:'assistant',content:full});
    S.msgCount++;
    save();
  }catch(e){
    if(e.name==='AbortError'){
      bubble.innerHTML=renderMD(full)+'\n\n<i style="color:var(--text-3)">[đã dừng]</i>';
      if(full) S.history.push({role:'assistant',content:full});
    }else{
      console.error(e);
      bubble.innerHTML='<span style="color:var(--red)">Lỗi: '+esc(e.message)+'</span>';
      wrap.classList.remove('thinking');
      toast('Lỗi: '+e.message.slice(0,80),'err');
    }
  }finally{
    S.streaming=false;
    S.abort=null;
    btn.classList.remove('stop');
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    $('input').focus();
  }
}

/* ===== MODEL PICKER ===== */
function openPicker(){ renderPicker(); $('pickerOverlay').classList.add('open'); }
function closePicker(){ $('pickerOverlay').classList.remove('open'); }
window.closePicker=closePicker;
function renderPicker(){
  const list=$('pickerList');
  const q=($('pickerSearch').value||'').toLowerCase();
  if(!S.freeModels.length){
    list.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--text-3);font-size:12.5px">Chưa có model.</div>';
    return;
  }
  const filtered=S.freeModels.filter(m=>!q||m.id.toLowerCase().includes(q));
  if(!filtered.length){ list.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--text-3);font-size:12.5px">Không tìm thấy.</div>'; return; }
  list.innerHTML='';
  filtered.forEach(m=>{
    const row=el('div',{class:'model-row'+(m.id===S.selectedModel?' active':'')});
    row.appendChild(el('span',{class:'m-name'},m.id));
    row.appendChild(el('span',{class:'m-tag'},'free'));
    row.addEventListener('click',()=>{
      S.selectedModel=m.id;
      save(); updateModelChip();
      toast('Đã đổi model','ok');
      closePicker();
    });
    list.appendChild(row);
  });
}
$('pickerSearch').addEventListener('input', renderPicker);
$('pickerOverlay').addEventListener('click', e=>{ if(e.target.id==='pickerOverlay') closePicker(); });

/* ===== SLASH MENU — ĐÃ BỎ =====
   Không autocomplete, không gợi ý, không ai biết có lệnh gì
*/
function openSlashMenu(){}
function closeSlashMenu(){}
function renderSlashMenu(){}

/* ===== EVENTS ===== */
$('btnSend').addEventListener('click', send);
$('input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('input').addEventListener('input', ()=>{
  $('input').style.height='auto';
  $('input').style.height=Math.min($('input').scrollHeight,220)+'px';
});

document.addEventListener('click', e=>{
  const card=e.target.closest('.hint');
  if(card){
    $('input').value=card.dataset.p;
    $('input').focus();
    $('input').dispatchEvent(new Event('input'));
  }
});

$('modelChip').addEventListener('click', ()=>{
  if(!S.freeModels.length) return;
  openPicker();
});

/* ===== INIT ===== */
load();

if (S.apiKey && S.selectedModel && S.freeModels.length){
  // Khôi phục phiên trước
  $('stream').style.display='flex';
  $('hero').style.display='none';
  addSys('✓ Đã khôi phục phiên làm việc', 'ok');
  setStatus('ok','Sẵn sàng');
  updateModelChip();
}
else if (S.apiKey){
  // Có key, chưa có model
  $('stream').style.display='flex';
  $('hero').style.display='none';
  setStatus('warn','Đang thiết lập...');
  updateModelChip('đang thiết lập...', true);
  setTimeout(() => autoSetup(), 400);
}
else {
  // Chưa có key — để hero hiện, user tự gõ /api
  setStatus('warn','Chưa có API key');
  updateModelChip('chưa có model', true);
}

})();
</script>
