<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Camera AI – COCO-SSD ổn định</title>

<!-- TF.js + COCO-SSD từ jsdelivr, có fallback -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; }
  body {
    min-height:100vh;
    background: radial-gradient(circle at 30% 10%, #1e2a3a, #0b0f14 80%);
    display:flex; align-items:center; justify-content:center;
    color:#e8f0fe; padding:20px;
  }
  .app {
    width:100%; max-width:1100px;
    background: rgba(18,26,36,0.75);
    backdrop-filter: blur(12px);
    border-radius:32px;
    border:1px solid rgba(100,180,255,0.25);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
    padding:28px;
  }
  h1 {
    font-size:1.9rem; font-weight:600;
    display:flex; align-items:center; gap:12px;
    margin-bottom:6px;
    background: linear-gradient(135deg,#a0d0ff,#6ea8fe);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { color:#9bb5d4; margin-bottom:20px; border-left:3px solid #3b82f6; padding-left:14px; font-size:.9rem; }

  .camera-wrapper {
    position:relative; width:100%; border-radius:24px; overflow:hidden;
    background:#0a0e12; aspect-ratio:4/3;
    box-shadow: 0 15px 30px -10px black, 0 0 0 1px rgba(59,130,246,0.3);
  }
  video, canvas {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover;
  }
  video { transform: scaleX(-1); z-index:1; }
  canvas { transform: scaleX(-1); z-index:2; pointer-events:none; }

  .controls {
    margin-top:20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    background: rgba(10,20,30,0.6); border-radius:60px; padding:12px 20px;
    border:1px solid rgba(70,130,200,0.3);
  }
  button {
    background: rgba(30,50,75,0.7);
    border:1px solid rgba(90,150,240,0.4);
    color:#c6dfff; padding:10px 22px; border-radius:40px;
    font-size:.9rem; font-weight:500; cursor:pointer;
    transition: all .2s;
    display:flex; align-items:center; gap:8px;
  }
  button:hover:not(:disabled) { background:#2a4a6e; border-color:#5b9aff; transform:translateY(-2px); }
  button.primary {
    background: linear-gradient(145deg,#2563eb,#1d4ed8);
    border-color:#93c5fd; color:white;
    box-shadow: 0 0 18px #3b82f6aa;
  }
  button.danger { background: linear-gradient(145deg,#dc2626,#b91c1c); border-color:#fca5a5; color:white; }
  button:disabled { opacity:.4; pointer-events:none; }

  .status { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:.85rem; color:#9fc9ff; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ef4444; box-shadow:0 0 10px #ef4444; transition:.3s; }
  .dot.on { background:#22c55e; box-shadow:0 0 12px #22c55e; }
  .dot.loading { background:#eab308; box-shadow:0 0 12px #eab308; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }

  .slider-wrap {
    display:flex; align-items:center; gap:10px;
    background:rgba(30,50,75,0.5); padding:8px 18px; border-radius:40px;
    border:1px solid rgba(90,150,240,0.3); font-size:.85rem;
  }
  input[type=range] { width:130px; accent-color:#3b82f6; }

  .debug {
    margin-top:12px; background:rgba(0,0,0,0.4); padding:12px 18px;
    border-radius:14px; font-family:monospace; font-size:.8rem;
    color:#7dd3fc; border:1px solid #1e3a5f;
    max-height:130px; overflow:auto; white-space:pre-wrap;
  }
</style>
</head>
<body>
<div class="app">
  <h1>📷 Camera AI – COCO-SSD</h1>
  <div class="sub">Nhẹ · Load nhanh · Ổn định · Vẽ khung chính xác</div>

  <div class="camera-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" class="primary" disabled>⏳ Đang tải model...</button>
    <button id="stopBtn" class="danger" disabled>⏹ Dừng</button>
    <div class="slider-wrap">
      <span>Ngưỡng:</span>
      <input type="range" id="confSlider" min="0.1" max="0.9" step="0.05" value="0.4">
      <span id="confValue">40%</span>
    </div>
    <div class="status">
      <span class="dot loading" id="statusDot"></span>
      <span id="statusText">Đang tải...</span>
    </div>
  </div>

  <div class="debug" id="debug">Khởi động...</div>
</div>

<script>
(function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlayCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const debugEl = document.getElementById('debug');
  const confSlider = document.getElementById('confSlider');
  const confValue = document.getElementById('confValue');

  let stream = null;
  let model = null;
  let modelReady = false;
  let isRunning = false;
  let isDetecting = false;
  let confThreshold = 0.4;
  let frameCount = 0;
  let loopTimer = null;

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    debugEl.textContent = `[${t}] ${msg}\n` + debugEl.textContent.split('\n').slice(0, 8).join('\n');
  }

  confSlider.addEventListener('input', () => {
    confThreshold = parseFloat(confSlider.value);
    confValue.textContent = Math.round(confThreshold * 100) + '%';
  });

  // Kiểm tra CDN đã load chưa
  function checkLibs() {
    if (typeof tf === 'undefined') {
      log('❌ TensorFlow.js chưa tải — kiểm tra mạng/CDN');
      statusText.textContent = 'Lỗi: TF.js không tải được';
      return false;
    }
    if (typeof cocoSsd === 'undefined') {
      log('❌ COCO-SSD chưa tải — kiểm tra mạng/CDN');
      statusText.textContent = 'Lỗi: COCO-SSD không tải được';
      return false;
    }
    return true;
  }

  // Load model
  async function loadModel() {
    if (!checkLibs()) return;
    try {
      log('Bắt đầu tải COCO-SSD (~5MB)...');
      statusText.textContent = 'Đang tải model...';

      // Ưu tiên WebGL, fallback CPU
      await tf.ready();
      log('Backend TF.js: ' + tf.getBackend());

      model = await cocoSsd.load({
        base: 'lite_mobilenet_v2' // nhẹ nhất, load nhanh nhất
      });

      modelReady = true;
      startBtn.disabled = false;
      startBtn.innerHTML = '▶ Bật Camera & AI';
      statusDot.classList.remove('loading');
      statusText.textContent = 'Model sẵn sàng';
      log('✅ COCO-SSD đã sẵn sàng');
    } catch (e) {
      console.error(e);
      log('❌ Lỗi tải model: ' + e.message);
      statusText.textContent = 'Lỗi tải model';
    }
  }

  // Bật camera
  async function startAll() {
    try {
      startBtn.disabled = true;
      statusText.textContent = 'Đang mở camera...';
      log('Yêu cầu camera...');

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} },
        audio: false
      });
      video.srcObject = stream;

      await new Promise(resolve => {
        if (video.readyState >= 2 && video.videoWidth > 0) return resolve();
        const onReady = () => {
          if (video.videoWidth > 0) {
            video.removeEventListener('loadedmetadata', onReady);
            video.removeEventListener('playing', onReady);
            resolve();
          }
        };
        video.addEventListener('loadedmetadata', onReady);
        video.addEventListener('playing', onReady);
      });

      await video.play().catch(()=>{});

      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      log(`📐 Video ${video.videoWidth}x${video.videoHeight}`);

      statusDot.classList.add('on');
      statusText.textContent = 'Đang quét...';
      isRunning = true;
      stopBtn.disabled = false;
      log('✅ Camera bật, bắt đầu quét');

      detectLoop();
    } catch (e) {
      console.error(e);
      log('❌ ' + e.message);
      statusText.textContent = 'Lỗi camera';
      startBtn.disabled = false;
      alert('Lỗi camera: ' + e.message + '\nChạy trên https hoặc localhost.');
    }
  }

  function stopAll() {
    isRunning = false;
    isDetecting = false;
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    statusDot.classList.remove('on');
    statusText.textContent = 'Đã dừng';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    log('⏹ Đã dừng');
  }

  // Vòng lặp detect
  async function detectLoop() {
    if (!isRunning) return;
    if (isDetecting) { loopTimer = setTimeout(detectLoop, 50); return; }
    if (!modelReady || !model) { loopTimer = setTimeout(detectLoop, 200); return; }
    if (video.readyState < 2 || !video.videoWidth) { loopTimer = setTimeout(detectLoop, 100); return; }

    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    isDetecting = true;
    frameCount++;

    try {
      const predictions = await model.detect(video, 20, confThreshold);
      isDetecting = false;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (frameCount % 15 === 0) {
        log(`🎯 Frame #${frameCount}: ${predictions.length} vật thể`);
      }

      if (predictions.length > 0) {
        drawBoxes(predictions);
      }

      loopTimer = setTimeout(detectLoop, 80);
    } catch (e) {
      isDetecting = false;
      log('❌ Detect lỗi: ' + e.message);
      loopTimer = setTimeout(detectLoop, 500);
    }
  }

  function drawBoxes(detections) {
    const W = canvas.width;

    detections.forEach((det) => {
      const [x, y, w, h] = det.bbox;
      const conf = det.score;
      const hue = Math.round(120 - conf * 90);
      const color = `hsl(${hue}, 90%, 58%)`;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(3, W / 350);
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.strokeRect(x, y, w, h);
      ctx.restore();

      const fontSize = Math.max(15, Math.round(W / 45));
      ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
      const text = `${det.class} ${Math.round(conf*100)}%`;
      const tw = ctx.measureText(text).width;
      const pad = fontSize * 0.5;

      let labelY = y - pad - 4;
      if (labelY < fontSize) labelY = y + h + fontSize + pad;

      ctx.save();
      ctx.fillStyle = 'rgba(10,15,25,0.85)';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(x, labelY - fontSize, tw + pad*2, fontSize + pad, 8);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 4;
      ctx.fillText(text, x + pad, labelY - pad/2);
      ctx.restore();
    });
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if (w<2*r) r=w/2; if (h<2*r) r=h/2;
      this.moveTo(x+r,y); this.lineTo(x+w-r,y);
      this.quadraticCurveTo(x+w,y,x+w,y+r);
      this.lineTo(x+w,y+h-r);
      this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      this.lineTo(x+r,y+h);
      this.quadraticCurveTo(x,y+h,x,y+h-r);
      this.lineTo(x,y+r);
      this.quadraticCurveTo(x,y,x+r,y);
      return this;
    };
  }

  startBtn.addEventListener('click', startAll);
  stopBtn.addEventListener('click', stopAll);
  window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (loopTimer) clearTimeout(loopTimer);
  });

  // Đợi DOM + libs, sau đó load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadModel);
  } else {
    loadModel();
  }
})();
</script>
</body>
</html>
