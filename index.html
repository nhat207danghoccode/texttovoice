<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My App</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My App" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />

  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 60%);
      color: #e2e8f0; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom); text-align: center;
      overflow: hidden;
    }

    /* Nền ánh sáng động */
    body::before {
      content: '';
      position: absolute;
      top: -200px; left: 50%; transform: translateX(-50%);
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    }

    .logo {
      width: 100px; height: 100px; border-radius: 26px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 20px 50px rgba(59,130,246,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
      position: relative;
      z-index: 1;
    }
    .logo svg { width: 56px; height: 56px; }

    h1 { font-size: 28px; margin-bottom: 10px; font-weight: 800; letter-spacing: -0.5px; position: relative; z-index: 1; }
    p { color: #94a3b8; margin-bottom: 36px; max-width: 380px; line-height: 1.6; font-size: 15px; position: relative; z-index: 1; }

    /* ============ NÚT CÀI ĐẶT XỊN ============ */
    #installBtn {
      display: none;
      position: relative;
      align-items: center;
      gap: 12px;
      padding: 18px 34px 18px 28px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #fff;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border: none;
      border-radius: 100px;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 12px 32px rgba(59,130,246,0.45),
        0 4px 12px rgba(139,92,246,0.3),
        inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.25s ease;
      z-index: 1;
    }
    #installBtn.show { display: inline-flex; animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Ánh sáng lướt qua */
    #installBtn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transition: left 0.6s ease;
    }
    #installBtn:hover::before { left: 100%; }

    #installBtn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 40px rgba(59,130,246,0.55),
        0 6px 16px rgba(139,92,246,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }
    #installBtn:active {
      transform: translateY(0) scale(0.97);
      box-shadow:
        0 6px 20px rgba(59,130,246,0.5),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    /* Icon download trong nút */
    #installBtn .btn-icon {
      width: 22px; height: 22px;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #installBtn:hover .btn-icon {
      transform: translateY(2px);
      animation: bounce 0.6s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(4px); }
    }

    /* Chấm sáng nhấp nháy */
    #installBtn .dot {
      position: absolute;
      top: 12px; right: 14px;
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 10px #4ade80;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ============ BADGE ĐÃ CÀI ============ */
    .badge {
      display: none; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 100px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(74,222,128,0.3);
      color: #4ade80;
      font-size: 14px; font-weight: 600;
      position: relative; z-index: 1;
    }
    .badge svg { width: 18px; height: 18px; }

    /* ============ MODAL iOS ============ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 1000; padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-radius: 24px; padding: 28px 24px 24px;
      max-width: 420px; width: 100%; text-align: left;
      animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 -10px 60px rgba(0,0,0,0.5);
    }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal h3 { font-size: 19px; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
    .modal h3 svg { width: 22px; height: 22px; color: #3b82f6; }
    .modal ol { padding-left: 20px; color: #cbd5e1; line-height: 2.1; font-size: 15px; }
    .modal ol li { margin-bottom: 6px; }
    .modal-close {
      margin-top: 24px; width: 100%; padding: 15px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 8px 24px rgba(59,130,246,0.4);
      transition: transform 0.15s ease;
    }
    .modal-close:active { transform: scale(0.97); }

    .share-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; vertical-align: middle;
      background: #3b82f6; color: #fff;
      border-radius: 6px; margin: 0 4px;
    }
    .share-icon svg { width: 14px; height: 14px; }
  </style>
</head>
<body>

  <!-- Logo SVG -->
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity="0.7"/>
    </svg>
  </div>

  <h1>My App</h1>
  <p>Trải nghiệm toàn màn hình như app native. Bấm nút bên dưới để cài đặt!</p>

  <!-- NÚT CÀI ĐẶT -->
  <button id="installBtn" aria-label="Thêm vào màn hình chính">
    <span class="dot"></span>
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v13m0 0l-5-5m5 5l5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 21h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span>Thêm vào màn hình chính</span>
  </button>

  <!-- BADGE ĐÃ CÀI -->
  <div id="installedBadge" class="badge">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Đang chạy toàn màn hình
  </div>

  <!-- MODAL iOS -->
  <div class="modal-overlay" id="iosModal">
    <div class="modal">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M12 18h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Thêm vào màn hình chính
      </h3>
      <ol>
        <li>Nhấn nút
          <span class="share-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 16V4m0 0L8 8m4-4l4 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </span>
          Chia sẻ trên Safari
        </li>
        <li>Cuộn xuống, chọn <strong>"Thêm vào MH chính"</strong></li>
        <li>Nhấn <strong>"Thêm"</strong> ở góc phải trên</li>
        <li>Mở app từ màn hình chính → toàn màn hình!</li>
      </ol>
      <button class="modal-close" onclick="document.getElementById('iosModal').classList.remove('show')">Đã hiểu</button>
    </div>
  </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(r => console.log('✅ SW:', r.scope))
        .catch(e => console.warn('⚠️ SW fail:', e.message));
    });
  }

  const installBtn = document.getElementById('installBtn');
  const installedBadge = document.getElementById('installedBadge');
  const iosModal = document.getElementById('iosModal');

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  let deferredPrompt = null;

  if (isStandalone) {
    installedBadge.style.display = 'inline-flex';
  } else {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add('show');
    });
    if (isIOS) installBtn.classList.add('show');
  }

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('Kết quả:', outcome);
      deferredPrompt = null;
      installBtn.classList.remove('show');
      return;
    }
    if (isIOS) {
      iosModal.classList.add('show');
      return;
    }
    alert('Trình duyệt chưa hỗ trợ. Dùng Chrome/Edge (Android/PC) hoặc Safari (iOS).');
  });

  iosModal.addEventListener('click', (e) => {
    if (e.target === iosModal) iosModal.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    installBtn.classList.remove('show');
    deferredPrompt = null;
  });
</script>
</body>
</html>
