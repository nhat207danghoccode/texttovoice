<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Three.js Load VRM/GLB (có log)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 10px; align-items: center;
            background: rgba(0,0,0,0.7); padding: 12px 18px; border-radius: 40px;
            backdrop-filter: blur(6px); width: 90%; max-width: 400px;
            box-sizing: border-box;
        }
        #ui label {
            flex: 1; text-align: center; color: #fff; background: #3a7bd5;
            padding: 12px 0; border-radius: 30px; font-size: 15px;
            font-weight: bold; cursor: pointer; transition: background 0.2s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #ui label:active { background: #2a5fa0; }
        #fileInput { display: none; }
        #status {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0,0,0,0.6); padding: 6px 14px;
            border-radius: 20px; font-size: 13px; z-index: 100;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/",
            "@needle-tools/gltf-progressive": "https://cdn.jsdelivr.net/npm/@needle-tools/gltf-progressive/gltf-progressive.min.js"
        }
    }
    </script>
</head>
<body>
    <div id="status">Sẵn sàng</div>
    <div id="ui">
        <label for="fileInput">📁 Chọn tệp VRM / GLB</label>
        <input type="file" id="fileInput" accept=".vrm,.glb,.gltf">
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { useNeedleProgressive } from '@needle-tools/gltf-progressive';

        console.log('%c=== Bắt đầu khởi tạo Three.js ===', 'color: #3a7bd5; font-weight: bold;');

        // 1. Khởi tạo scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        console.log('[Scene] Đã tạo, màu nền: 0x111111');

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 2.5);
        console.log('[Camera] Đã tạo, vị trí ban đầu:', camera.position.toArray());

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        console.log('[Renderer] Đã tạo, kích thước:', window.innerWidth, 'x', window.innerHeight, '| pixelRatio:', renderer.getPixelRatio());

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.enableDamping = true;
        console.log('[Controls] Đã tạo, target:', controls.target.toArray());

        // Ánh sáng
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
        fillLight.position.set(-1, 1, -1);
        scene.add(fillLight);
        console.log('[Light] Đã thêm 3 nguồn sáng: Ambient + Directional chính + Directional phụ');

        // 2. Đăng ký plugin tải tiến tiến
        const loader = new GLTFLoader();
        console.log('[Loader] GLTFLoader đã được khởi tạo');
        try {
            useNeedleProgressive(loader, renderer);
            console.log('%c[Progressive] Plugin tải tiến tiến đã đăng ký thành công', 'color: #27ae60;');
        } catch (e) {
            console.warn('[Progressive] Đăng ký thất bại, sẽ chuyển sang tải thông thường:', e);
        }

        let currentModel = null;
        const statusEl = document.getElementById('status');

        // 3. Xử lý tải lên tệp
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                console.warn('[Upload] Người dùng không chọn tệp');
                return;
            }

            console.log('%c=== Bắt đầu tải lên tệp ===', 'color: #e67e22; font-weight: bold;');
            console.log('[Upload] Tên tệp:', file.name);
            console.log('[Upload] Kích thước:', (file.size / 1024 / 1024).toFixed(2), 'MB');
            console.log('[Upload] Loại:', file.type || 'không xác định');

            statusEl.textContent = 'Đang tải: ' + file.name;

            // Xóa mô hình cũ
            if (currentModel) {
                console.log('[Scene] Xóa mô hình cũ:', currentModel.name || 'không tên');
                scene.remove(currentModel);
                currentModel = null;
            }

            const url = URL.createObjectURL(file);
            console.log('[URL] Đã tạo URL tạm thời:', url);

            const loadStart = performance.now();

            loader.load(url, (gltf) => {
                const loadTime = (performance.now() - loadStart).toFixed(0);
                console.log('%c=== Tải mô hình thành công ===', 'color: #27ae60; font-weight: bold;');
                console.log('[Load] Thời gian tải (bao gồm phân tích cú pháp):', loadTime, 'ms');
                console.log('[Load] Số lượng đối tượng con trong scene:', gltf.scene.children.length);
                console.log('[Load] Danh sách animation:', gltf.animations.map(a => a.name));

                const model = gltf.scene;
                scene.add(model);
                currentModel = model;

                // Tự động điều chỉnh kích thước và vị trí
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                console.log('[Bounds] Kích thước mô hình:', size.toArray().map(v => v.toFixed(2)));
                console.log('[Bounds] Tâm mô hình:', center.toArray().map(v => v.toFixed(2)));
                console.log('[Bounds] Điểm thấp nhất Y:', box.min.y.toFixed(2));

                model.position.x -= center.x;
                model.position.z -= center.z;
                model.position.y -= box.min.y;
                console.log('[Model] Đã điều chỉnh vị trí, đặt vào giữa mặt đất');

                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(0, size.y * 0.8, maxDim * 2.2);
                controls.target.set(0, size.y * 0.4, 0);
                controls.update();
                console.log('[Camera] Đã điều chỉnh theo mô hình, vị trí mới:', camera.position.toArray().map(v => v.toFixed(2)));
                console.log('[Controls] target mới:', controls.target.toArray().map(v => v.toFixed(2)));

                statusEl.textContent = 'Đã tải: ' + file.name;
                URL.revokeObjectURL(url);
                console.log('[URL] Đã giải phóng URL tạm thời');
            }, (xhr) => {
                // Tiến trình tải
                if (xhr.total > 0) {
                    const percent = ((xhr.loaded / xhr.total) * 100).toFixed(1);
                    console.log(`[Progress] Đã tải ${percent}% (${(xhr.loaded / 1024).toFixed(0)} KB / ${(xhr.total / 1024).toFixed(0)} KB)`);
                } else {
                    console.log(`[Progress] Đã tải ${(xhr.loaded / 1024).toFixed(0)} KB (không xác định tổng dung lượng)`);
                }
            }, (err) => {
                console.error('%c=== Tải mô hình thất bại ===', 'color: #e74c3c; font-weight: bold;');
                console.error('[Error] Chi tiết:', err);
                statusEl.textContent = 'Tải thất bại: ' + (err.message || 'không rõ lỗi');
                URL.revokeObjectURL(url);
            });
        });

        // 4. Vòng lặp render
        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            frameCount++;
            // In log hiệu năng mỗi 300 khung hình
            if (frameCount % 300 === 0) {
                console.log(`[Render] Đã render ${frameCount} khung hình, FPS ước tính: ${(300 / (performance.now() / 1000)).toFixed(1)}`);
            }
        }
        animate();
        console.log('[Loop] Vòng lặp render đã bắt đầu');

        // 5. Thích ứng kích thước
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            console.log('[Resize] Cửa sổ thay đổi, kích thước mới:', window.innerWidth, 'x', window.innerHeight);
        });

        console.log('%c=== Khởi tạo hoàn tất, vui lòng chọn tệp ===', 'color: #3a7bd5; font-weight: bold;');
    </script>
</body>
</html>
