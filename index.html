<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS ◈ AI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
  :root{
    --neon:#00ffff;
    --purple:#a855f7;
    --pink:#ec4899;
    --green:#00ff9d;
    --bg:#05010d;
    --panel:#0a0618;
  }
  html,body{height:100%;width:100%;background:var(--bg);color:#e0e7ff;overflow:hidden;font-size:14px;}

  body{display:flex;justify-content:center;align-items:center;padding:14px;position:relative;}

  /* ===== BACKGROUND LAYERS ===== */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(168,85,247,.35), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(0,255,255,.25), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(236,72,153,.15), transparent 60%),
      #05010d;
    animation:bgShift 15s ease-in-out infinite;
  }
  @keyframes bgShift{
    0%,100%{filter:hue-rotate(0deg);}
    50%{filter:hue-rotate(30deg);}
  }

  #stars{position:fixed;inset:0;z-index:1;pointer-events:none;}

  .grid{
    position:fixed;inset:0;z-index:0;
    background-image:
      linear-gradient(rgba(168,85,247,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,255,.08) 1px,transparent 1px);
    background-size:60px 60px;
    mask:radial-gradient(ellipse at center,#000 20%,transparent 70%);
    -webkit-mask:radial-gradient(ellipse at center,#000 20%,transparent 70%);
    animation:gridScroll 30s linear infinite;
  }
  @keyframes gridScroll{
    from{background-position:0 0,0 0;}
    to{background-position:60px 60px,60px 60px;}
  }

  .vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7) 100%);
  }

  /* ===== LAYOUT ===== */
  .app{
    position:relative;z-index:10;
    width:100%;max-width:1100px;height:92vh;max-height:900px;
    display:grid;grid-template-columns:260px 1fr;
    border-radius:24px;
    overflow:hidden;
    border:1px solid rgba(168,85,247,.4);
    background:rgba(10,6,24,.75);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    box-shadow:
      0 0 100px rgba(168,85,247,.4),
      0 0 200px rgba(0,255,255,.15),
      inset 0 0 80px rgba(168,85,247,.05);
    animation:appIn 1s cubic-bezier(.16,1,.3,1);
  }
  @keyframes appIn{
    from{opacity:0;transform:scale(.92) translateY(30px);filter:blur(20px);}
    to{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}
  }

  /* Neon border rotating */
  .app::before{
    content:'';position:absolute;inset:0;border-radius:24px;padding:1px;
    background:conic-gradient(from 0deg,#00ffff,#a855f7,#ec4899,#00ff9d,#00ffff);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 8s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== SIDEBAR ===== */
  .side{
    background:linear-gradient(180deg,rgba(168,85,247,.08),rgba(0,0,0,.3));
    border-right:1px solid rgba(168,85,247,.2);
    display:flex;flex-direction:column;
    padding:20px 16px;
    gap:16px;
    position:relative;
  }
  .side::after{
    content:'';position:absolute;top:0;right:-1px;bottom:0;width:1px;
    background:linear-gradient(180deg,transparent,#00ffff,#a855f7,transparent);
    background-size:100% 200%;
    animation:lineFlow 3s linear infinite;
  }
  @keyframes lineFlow{
    from{background-position:0 0;}
    to{background-position:0 200%;}
  }

  .brand{
    display:flex;align-items:center;gap:12px;
    padding-bottom:16px;
    border-bottom:1px solid rgba(168,85,247,.15);
  }
  .logo{
    width:42px;height:42px;border-radius:12px;
    background:conic-gradient(from 0deg,#00ffff,#a855f7,#ec4899,#00ffff);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#fff;
    position:relative;
    animation:spin 4s linear infinite;
    box-shadow:0 0 24px rgba(0,255,255,.6);
    flex-shrink:0;
  }
  .logo::before{
    content:'';position:absolute;inset:3px;border-radius:9px;
    background:var(--bg);
  }
  .logo span{position:relative;z-index:1;}
  .brand-text h1{
    font-size:13px;font-weight:800;letter-spacing:3px;
    background:linear-gradient(90deg,#00ffff,#a855f7,#ec4899);
    background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shine 3s linear infinite;
  }
  @keyframes shine{to{background-position:200% center;}}
  .brand-text p{
    font-size:9.5px;color:#6b7a90;letter-spacing:2px;
    font-family:'Courier New',monospace;
    margin-top:3px;
  }

  .side-label{
    font-size:10px;letter-spacing:2.5px;color:#6b7a90;
    text-transform:uppercase;font-family:'Courier New',monospace;
    display:flex;align-items:center;gap:8px;
  }
  .side-label::before{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,rgba(168,85,247,.4),transparent);
  }

  .model-list{
    flex:1;overflow-y:auto;
    display:flex;flex-direction:column;gap:6px;
    padding-right:4px;
  }
  .model-list::-webkit-scrollbar{width:4px;}
  .model-list::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#00ffff,#ec4899);
    border-radius:4px;
  }

  .m-item{
    padding:10px 12px;
    border-radius:10px;
    border:1px solid rgba(168,85,247,.15);
    background:rgba(168,85,247,.03);
    color:#a5b4fc;
    font-size:11.5px;
    cursor:pointer;
    transition:all .25s;
    font-family:'Courier New',monospace;
    letter-spacing:.3px;
    display:flex;align-items:center;gap:8px;
    position:relative;
    overflow:hidden;
  }
  .m-item::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--neon);
    transform:scaleY(0);
    transition:transform .3s;
  }
  .m-item:hover{
    background:rgba(0,255,255,.08);
    border-color:rgba(0,255,255,.4);
    color:#fff;
    transform:translateX(3px);
  }
  .m-item.active{
    background:linear-gradient(90deg,rgba(0,255,255,.15),rgba(168,85,247,.1));
    border-color:var(--neon);
    color:#fff;
    box-shadow:0 0 20px rgba(0,255,255,.3);
  }
  .m-item.active::before{transform:scaleY(1);}

  .m-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    flex-shrink:0;
    animation:pulseDot 1.8s infinite;
  }
  @keyframes pulseDot{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.5;transform:scale(1.3);}
  }

  .m-text{
    flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .m-badge{
    font-size:8.5px;padding:2px 6px;border-radius:5px;
    background:rgba(0,255,157,.15);
    color:var(--green);
    border:1px solid rgba(0,255,157,.4);
    letter-spacing:1px;font-weight:700;
    flex-shrink:0;
  }

  .side-footer{
    padding-top:12px;
    border-top:1px solid rgba(168,85,247,.15);
    font-size:10px;color:#6b7a90;
    font-family:'Courier New',monospace;
    letter-spacing:1.5px;
    display:flex;flex-direction:column;gap:6px;
  }
  .status-line{
    display:flex;align-items:center;gap:8px;
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
    animation:pulseDot 1.5s infinite;
  }
  .status-dot.offline{background:#ff4d6d;box-shadow:0 0 10px #ff4d6d;}

  /* ===== MAIN ===== */
  .main{
    display:flex;flex-direction:column;
    position:relative;
  }

  .topbar{
    padding:16px 22px;
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,rgba(168,85,247,.08),transparent);
    border-bottom:1px solid rgba(168,85,247,.15);
    position:relative;
  }
  .topbar::after{
    content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,#00ffff,#ec4899,#00ffff,transparent);
    background-size:200% 100%;
    animation:shine 3s linear infinite;
  }

  .avatar{
    width:44px;height:44px;border-radius:14px;
    background:linear-gradient(135deg,#00ffff,#a855f7,#ec4899);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#fff;
    box-shadow:0 0 24px rgba(168,85,247,.6);
    position:relative;
    flex-shrink:0;
  }
  .avatar::after{
    content:'';position:absolute;inset:-6px;border-radius:20px;
    border:1.5px solid rgba(0,255,255,.5);
    animation:ringPulse 2.4s ease-out infinite;
  }
  @keyframes ringPulse{
    0%{transform:scale(.85);opacity:1;}
    100%{transform:scale(1.4);opacity:0;}
  }

  .topbar-info h2{
    font-size:14px;font-weight:700;letter-spacing:1px;color:#fff;
  }
  .topbar-info p{
    font-size:10.5px;color:#6b7a90;letter-spacing:1.5px;
    font-family:'Courier New',monospace;
    margin-top:3px;
    display:flex;align-items:center;gap:6px;
  }

  .topbar-actions{margin-left:auto;display:flex;gap:8px;}

  .ibtn{
    width:38px;height:38px;
    border-radius:11px;
    border:1px solid rgba(0,255,255,.25);
    background:rgba(0,255,255,.04);
    color:var(--neon);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s;
    font-size:15px;
  }
  .ibtn:hover{
    background:rgba(0,255,255,.12);
    border-color:var(--neon);
    box-shadow:0 0 20px rgba(0,255,255,.5);
    transform:translateY(-2px);
  }
  .ibtn.danger{color:#ff4d6d;border-color:rgba(255,77,109,.25);}
  .ibtn.danger:hover{
    background:rgba(255,77,109,.12);
    border-color:#ff4d6d;
    box-shadow:0 0 20px rgba(255,77,109,.5);
  }

  .chat-box{
    flex:1;overflow-y:auto;
    padding:26px 26px;
    display:flex;flex-direction:column;gap:18px;
    scroll-behavior:smooth;
  }
  .chat-box::-webkit-scrollbar{width:6px;}
  .chat-box::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#00ffff,#ec4899);
    border-radius:6px;
  }

  .msg{
    display:flex;gap:12px;
    animation:msgIn .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes msgIn{
    from{opacity:0;transform:translateY(20px);filter:blur(8px);}
    to{opacity:1;transform:translateY(0);filter:blur(0);}
  }
  .msg.user{justify-content:flex-end;}
  .msg.bot{justify-content:flex-start;}

  .msg-avatar{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;
    margin-top:4px;
  }
  .msg.bot .msg-avatar{
    background:linear-gradient(135deg,#00ffff,#a855f7);
    box-shadow:0 0 16px rgba(0,255,255,.5);
  }
  .msg.user .msg-avatar{
    background:linear-gradient(135deg,#ec4899,#a855f7);
    box-shadow:0 0 16px rgba(236,72,153,.5);
    order:2;
  }
  .msg.user .bubble{order:1;}

  .bubble{
    max-width:72%;
    padding:13px 18px;
    border-radius:16px;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
    word-wrap:break-word;
    position:relative;
  }

  .msg.bot .bubble{
    background:linear-gradient(135deg,rgba(0,255,255,.08),rgba(168,85,247,.06));
    border:1px solid rgba(0,255,255,.25);
    border-top-left-radius:4px;
    color:#e0e7ff;
    box-shadow:0 0 24px rgba(0,255,255,.1);
  }

  .msg.user .bubble{
    background:linear-gradient(135deg,#a855f7,#ec4899);
    border:1px solid rgba(236,72,153,.5);
    border-top-right-radius:4px;
    color:#fff;
    box-shadow:0 0 28px rgba(236,72,153,.45);
  }

  .typing{display:flex;gap:5px;padding:15px 18px;}
  .typing span{
    width:8px;height:8px;border-radius:50%;
    background:var(--neon);
    box-shadow:0 0 10px var(--neon);
    animation:bnc 1.4s infinite;
  }
  .typing span:nth-child(2){background:var(--purple);box-shadow:0 0 10px var(--purple);animation-delay:.2s;}
  .typing span:nth-child(3){background:var(--pink);box-shadow:0 0 10px var(--pink);animation-delay:.4s;}
  @keyframes bnc{
    0%,60%,100%{transform:translateY(0);opacity:.4;}
    30%{transform:translateY(-8px);opacity:1;}
  }

  /* ===== INPUT ===== */
  .input-area{
    padding:16px 22px 20px;
    border-top:1px solid rgba(168,85,247,.15);
    background:linear-gradient(0deg,rgba(168,85,247,.05),transparent);
    display:flex;gap:10px;align-items:center;
  }

  .input-shell{
    flex:1;
    display:flex;align-items:center;
    padding:5px 6px 5px 18px;
    border-radius:16px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(168,85,247,.25);
    transition:all .3s;
  }
  .input-shell:focus-within{
    border-color:var(--neon);
    box-shadow:0 0 0 3px rgba(0,255,255,.12),0 0 30px rgba(0,255,255,.35);
    background:rgba(0,255,255,.05);
  }

  #inp{
    flex:1;background:transparent;border:none;outline:none;
    color:#fff;font-size:14.5px;padding:13px 0;
    font-family:inherit;
  }
  #inp::placeholder{color:#6b7a90;}

  .send{
    width:54px;height:54px;border-radius:16px;
    border:none;
    background:linear-gradient(135deg,#00ffff,#a855f7,#ec4899);
    background-size:200% 200%;
    color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s;
    box-shadow:0 0 26px rgba(0,255,255,.5),0 0 50px rgba(236,72,153,.3);
    animation:gradShift 3s ease infinite;
    flex-shrink:0;
  }
  @keyframes gradShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  .send:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 0 40px rgba(0,255,255,.8),0 0 70px rgba(236,72,153,.5);
  }
  .send:active{transform:scale(.94);}
  .send:disabled{opacity:.4;cursor:not-allowed;}

  /* ===== TOAST ===== */
  .toast{
    position:fixed;top:20px;left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:rgba(10,6,24,.96);
    border:1px solid rgba(0,255,255,.5);
    color:#fff;padding:12px 22px;border-radius:12px;
    font-size:12.5px;z-index:9999;
    transition:transform .4s cubic-bezier(.16,1,.3,1);
    box-shadow:0 0 40px rgba(0,255,255,.5);
    font-family:'Courier New',monospace;
    letter-spacing:.5px;
    max-width:90vw;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  /* ===== RESPONSIVE ===== */
  @media (max-width:800px){
    .app{grid-template-columns:1fr;}
    .side{
      position:absolute;top:0;left:0;bottom:0;width:280px;
      z-index:50;transform:translateX(-100%);
      transition:transform .35s;background:rgba(10,6,24,.98);
    }
    .side.show{transform:translateX(0);}
  }
  @media (max-width:600px){
    body{padding:0;}
    .app{height:100vh;max-height:none;border-radius:0;}
  }
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="stars"></canvas>
<div class="grid"></div>
<div class="vignette"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><span>◈</span></div>
      <div class="brand-text">
        <h1>NEXUS AI</h1>
        <p>v3.0 · NEURAL</p>
      </div>
    </div>

    <div class="side-label">Models</div>
    <div class="model-list" id="modelList"></div>

    <div class="side-footer">
      <div class="status-line">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">DISCONNECTED</span>
      </div>
      <div id="keyStatus" style="color:#6b7a90;">NO API KEY</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="avatar">✦</div>
      <div class="topbar-info">
        <h2>Neural Assistant</h2>
        <p><span class="status-dot" style="width:5px;height:5px;"></span> <span id="currentModel">sẵn sàng</span></p>
      </div>
      <div class="topbar-actions">
        <button class="ibtn" id="menuBtn" title="Menu" style="display:none;">☰</button>
        <button class="ibtn danger" id="clearBtn" title="Xóa">✕</button>
      </div>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">
        <div class="msg-avatar">✦</div>
        <div class="bubble">Xin chào! Tôi là NEXUS AI ✨<br>Hãy bắt đầu trò chuyện.</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-shell">
        <input id="inp" type="text" placeholder="Nhập tin nhắn..." autocomplete="off">
      </div>
      <button class="send" id="sendBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const API_BASE = "https://api.xkiro.com/v1";
const LS_KEY = "nx_key", LS_MODEL = "nx_model";

// Danh sách model fallback — luôn có sẵn nếu API không trả list
const FALLBACK_MODELS = [
  "openai/gpt-5.6-sol",
  "openai/gpt-4o-mini",
  "openai/gpt-4o",
  "openai/gpt-3.5-turbo",
  "meta-llama/llama-3.1-8b-instruct",
  "meta-llama/llama-3.1-70b-instruct",
  "google/gemini-flash-1.5",
  "google/gemini-pro-1.5",
  "anthropic/claude-3.5-sonnet",
  "mistralai/mistral-7b-instruct",
  "qwen/qwen-2.5-7b-instruct",
  "deepseek/deepseek-chat",
];

// Model MIỄN PHÍ (whitelist) — chỉ hiện những model này
// Các model trả phí bị ẩn hoàn toàn
const FREE_WHITELIST_PATTERNS = [
  /free/i,
  /gpt-5\.6-sol/i,
  /gpt-4o-mini/i,
  /llama-3\.1-8b/i,
  /gemini-flash/i,
  /mistral-7b/i,
  /qwen.*7b/i,
  /deepseek-chat/i,
];

const S = {
  key: localStorage.getItem(LS_KEY) || "",
  model: localStorage.getItem(LS_MODEL) || "",
  messages: [],
  sending: false,
  freeModels: [],
  online: false,
};

/* =========================================================
   DOM
   ========================================================= */
const $ = (id) => document.getElementById(id);
const chatBox = $("chatBox"), inp = $("inp"), sendBtn = $("sendBtn");
const clearBtn = $("clearBtn"), modelList = $("modelList");
const toastEl = $("toast"), statusDot = $("statusDot");
const statusText = $("statusText"), keyStatus = $("keyStatus");
const currentModel = $("currentModel");

/* =========================================================
   PARTICLE STARS
   ========================================================= */
(function stars(){
  const c = $("stars"), ctx = c.getContext("2d");
  let W, H, parts = [], mouse = {x:-9999,y:-9999};

  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  resize(); addEventListener("resize", resize);

  const COLORS = ["#00ffff","#a855f7","#ec4899","#00ff9d"];
  for(let i=0;i<120;i++){
    parts.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3,
      r: Math.random()*1.6+.5,
      c: COLORS[Math.floor(Math.random()*COLORS.length)],
      p: Math.random()*Math.PI*2,
    });
  }

  addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });

  function loop(){
    ctx.clearRect(0,0,W,H);

    // connect lines
    for(let i=0;i<parts.length;i++){
      for(let j=i+1;j<parts.length;j++){
        const a = parts[i], b = parts[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const d2 = dx*dx+dy*dy;
        if(d2 < 10000){
          ctx.strokeStyle = `rgba(0,255,255,${(1-d2/10000)*.15})`;
          ctx.lineWidth = .5;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }

    parts.forEach(p => {
      const dx = p.x-mouse.x, dy = p.y-mouse.y;
      const d = Math.hypot(dx,dy);
      if(d < 120){
        p.vx += (dx/d)*.3;
        p.vy += (dy/d)*.3;
      }
      p.x += p.vx; p.y += p.vy;
      p.vx *= .98; p.vy *= .98;
      p.p += .05;

      if(p.x<0) p.x=W; if(p.x>W) p.x=0;
      if(p.y<0) p.y=H; if(p.y>H) p.y=0;

      ctx.shadowBlur = 12;
      ctx.shadowColor = p.c;
      ctx.fillStyle = p.c;
      ctx.globalAlpha = .6 + Math.sin(p.p)*.4;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    });

    requestAnimationFrame(loop);
  }
  loop();
})();

/* =========================================================
   TOAST
   ========================================================= */
function toast(t, ms=2400){
  toastEl.textContent = t;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove("show"), ms);
}

/* =========================================================
   MESSAGE
   ========================================================= */
function addMsg(role, text){
  const w = document.createElement("div");
  w.className = "msg " + role;
  const av = document.createElement("div");
  av.className = "msg-avatar";
  av.textContent = role === "bot" ? "✦" : "◉";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  w.appendChild(av);
  w.appendChild(b);
  chatBox.appendChild(w);
  chatBox.scrollTop = chatBox.scrollHeight;
  return b;
}
function addTyping(){
  const w = document.createElement("div");
  w.className = "msg bot"; w.id = "typing";
  w.innerHTML = `
    <div class="msg-avatar">✦</div>
    <div class="bubble typing"><span></span><span></span><span></span></div>`;
  chatBox.appendChild(w);
  chatBox.scrollTop = chatBox.scrollHeight;
}
function rmTyping(){ $("typing")?.remove(); }

/* =========================================================
   TEST MỘT MODEL CÓ CHẠY ĐƯỢC KHÔNG
   ========================================================= */
async function testModel(modelId){
  try {
    const r = await fetch(`${API_BASE}/chat/completions`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:`Bearer ${S.key}`,
      },
      body: JSON.stringify({
        model: modelId,
        messages:[{ role:"user", content:"hi" }],
        max_tokens: 5,
      }),
      signal: AbortSignal.timeout(15000),
    });
    return r.ok;
  } catch { return false; }
}

/* =========================================================
   QUÉT MODEL — TEST TỪNG CÁI, CHỈ GIỮ CÁI CHẠY ĐƯỢC
   ========================================================= */
async function scanModels(){
  if(!S.key) return;
  statusText.textContent = "SCANNING...";
  statusDot.classList.remove("offline");
  currentModel.textContent = "đang quét model...";

  // 1) Thử lấy list từ API
  let candidates = [];
  try {
    const r = await fetch(`${API_BASE}/models`, {
      headers:{ Authorization:`Bearer ${S.key}` },
      signal: AbortSignal.timeout(10000),
    });
    if(r.ok){
      const data = await r.json();
      const all = data.data || data.models || [];
      candidates = all
        .map(m => m.id || m.name)
        .filter(Boolean)
        .filter(id => FREE_WHITELIST_PATTERNS.some(p => p.test(id)));
    }
  } catch(e){ console.warn("Model list fetch failed:", e); }

  // 2) Nếu không có → dùng fallback
  if(candidates.length === 0){
    candidates = FALLBACK_MODELS.filter(id =>
      FREE_WHITELIST_PATTERNS.some(p => p.test(id))
    );
    if(candidates.length === 0) candidates = [...FALLBACK_MODELS];
  }

  toast(`🔍 Đang test ${candidates.length} model...`, 3000);

  // 3) Test song song, giữ những cái OK
  const results = await Promise.all(
    candidates.map(async id => ({ id, ok: await testModel(id) }))
  );
  const working = results.filter(r => r.ok).map(r => r.id);

  if(working.length === 0){
    // Không model nào chạy → giữ candidates làm list dự phòng (UI vẫn hoạt động)
    S.freeModels = candidates.slice(0, 6);
    S.online = false;
    statusDot.classList.add("offline");
    statusText.textContent = "NO WORKING MODEL";
    toast("⚠️ Không model nào phản hồi — dùng thử model mặc định", 3000);
  } else {
    S.freeModels = working;
    S.online = true;
    statusDot.classList.remove("offline");
    statusText.textContent = "ONLINE";
    toast(`✅ ${working.length} model hoạt động`, 2600);
  }

  // 4) Chọn model mặc định
  if(!S.model || !S.freeModels.includes(S.model)){
    S.model = S.freeModels[0];
    localStorage.setItem(LS_MODEL, S.model);
  }

  keyStatus.textContent = "KEY: " + S.key.slice(0, 8) + "..." + S.key.slice(-4);
  currentModel.textContent = short(S.model);
  renderModels();
}

function short(id){
  if(!id) return "—";
  const p = String(id).split("/");
  return p[p.length-1].slice(0,28);
}

/* =========================================================
   RENDER MODEL LIST
   ========================================================= */
function renderModels(){
  modelList.innerHTML = "";
  if(!S.freeModels.length){
    modelList.innerHTML = `<div style="color:#6b7a90;font-size:10.5px;
      text-align:center;padding:20px;font-family:'Courier New',monospace;
      letter-spacing:1px;">CHƯA CÓ MODEL<br><br>Nhập /api &lt;key&gt;</div>`;
    return;
  }
  S.freeModels.forEach(id => {
    const el = document.createElement("div");
    el.className = "m-item" + (id === S.model ? " active" : "");
    el.innerHTML = `
      <span class="m-dot"></span>
      <span class="m-text" title="${id}">${short(id)}</span>
      <span class="m-badge">FREE</span>`;
    el.onclick = () => {
      S.model = id;
      localStorage.setItem(LS_MODEL, id);
      currentModel.textContent = short(id);
      renderModels();
      toast("🔄 Đã đổi · " + short(id));
    };
    modelList.appendChild(el);
  });
}

/* =========================================================
   HIDDEN COMMAND /api
   ========================================================= */
async function handleHidden(txt){
  const t = txt.trim();

  if(/^\/api\s+/i.test(t)){
    const key = t.replace(/^\/api\s+/i,"").trim();
    if(!key) return false;
    S.key = key;
    localStorage.setItem(LS_KEY, key);
    keyStatus.textContent = "KEY: " + key.slice(0,8) + "..." + key.slice(-4);
    await scanModels();
    return true;
  }
  if(/^\/api$/i.test(t)){
    S.key = ""; S.model = ""; S.freeModels = []; S.online = false;
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(LS_MODEL);
    statusDot.classList.add("offline");
    statusText.textContent = "DISCONNECTED";
    keyStatus.textContent = "NO API KEY";
    currentModel.textContent = "sẵn sàng";
    renderModels();
    toast("🗑 Đã xóa API key");
    return true;
  }
  return false;
}

/* =========================================================
   CHAT
   ========================================================= */
async function chatAPI(text){
  if(!S.key) return "⚠️ Chưa cấu hình API.";
  if(!S.model) await scanModels();

  S.messages.push({ role:"user", content:text });

  const r = await fetch(`${API_BASE}/chat/completions`, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${S.key}`,
    },
    body: JSON.stringify({ model:S.model, messages:S.messages }),
  });

  if(!r.ok){
    const err = await r.text().catch(()=>"");
    throw new Error(`API ${r.status}: ${err.slice(0,200)}`);
  }
  const data = await r.json();
  const reply = data.choices?.[0]?.message?.content
             ?? data.choices?.[0]?.text
             ?? "(không có phản hồi)";
  S.messages.push({ role:"assistant", content:reply });
  return reply;
}

async function send(){
  if(S.sending) return;
  const text = inp.value.trim();
  if(!text) return;
  inp.value = "";

  if(await handleHidden(text)) return;

  addMsg("user", text);
  S.sending = true; sendBtn.disabled = true;
  addTyping();

  try {
    const reply = await chatAPI(text);
    rmTyping();
    addMsg("bot", reply);
  } catch(e){
    rmTyping();
    addMsg("bot", "❌ Lỗi: " + e.message);
  } finally {
    S.sending = false; sendBtn.disabled = false;
    inp.focus();
  }
}

/* =========================================================
   EVENTS
   ========================================================= */
sendBtn.addEventListener("click", send);
inp.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
clearBtn.addEventListener("click", () => {
  S.messages = [];
  chatBox.innerHTML = "";
  addMsg("bot", "Đã xóa hội thoại. Bắt đầu lại nhé! ✨");
});

// Menu button cho mobile
const menuBtn = $("menuBtn");
const side = $("side");
function checkMobile(){
  menuBtn.style.display = innerWidth <= 800 ? "flex" : "none";
}
checkMobile();
addEventListener("resize", checkMobile);
menuBtn.addEventListener("click", () => side.classList.toggle("show"));

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  renderModels();
  if(S.key){
    keyStatus.textContent = "KEY: " + S.key.slice(0,8) + "..." + S.key.slice(-4);
    await scanModels();
  } else {
    statusDot.classList.add("offline");
    statusText.textContent = "DISCONNECTED";
  }
  inp.focus();
})();
</script>
